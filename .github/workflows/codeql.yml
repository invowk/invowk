name: CodeQL

# All languages are analyzed via this advanced-setup workflow. GitHub's
# default setup cannot coexist with advanced CodeQL uploads (the SARIF
# processing rejects them repo-wide while default setup is enabled), and
# default-setup runners pin their own Go toolchain (GOTOOLCHAIN=local),
# which breaks whenever go.mod requires a newer Go than the runner ships.

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    # Weekly scan to match the former default-setup cadence.
    - cron: "17 6 * * 1"

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

env:
  # Fall back to direct module fetches on transient Go proxy failures.
  GOPROXY: "https://proxy.golang.org|direct"

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: actions
            build-mode: none
          - language: go
            build-mode: autobuild
          - language: javascript-typescript
            build-mode: none
          - language: python
            build-mode: none

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # go-version-file keeps the analysis toolchain in lockstep with the
      # module requirement, immunizing this scan against Go version bumps.
      - name: Set up Go
        if: matrix.language == 'go'
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      - name: Autobuild
        if: matrix.build-mode == 'autobuild'
        uses: github/codeql-action/autobuild@v4

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
