name: Release Signing Dry Run

# GoReleaser snapshot with Cosign keyless signing, the part of a release that
# needs `id-token: write`. It lives in its own workflow, which no pull request
# can start, so the OIDC grant never reaches pull request code. ci.yml's
# `release-dry-run` (the required `Release Dry Run` check) runs the same
# snapshot tokenless with --skip=sign on every event.
on:
  # Keep these paths in sync with ci.yml's push trigger (this file replaces
  # ci.yml in the list).
  push:
    branches:
      - main
    paths:
      - 'cmd/**'
      - 'internal/**'
      - 'pkg/**'
      - 'tests/**'
      - '*.go'
      - 'go.mod'
      - 'go.sum'
      - 'Makefile'
      - 'scripts/**'
      - 'default.pgo'
      - '.goreleaser.yaml'
      - '.github/workflows/release-signing.yml'
  release:
    types:
      - published
  workflow_dispatch:

concurrency:
  group: release-signing-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Fall back to direct module fetches on transient Go proxy failures.
  GOPROXY: "https://proxy.golang.org|direct"

jobs:
  release-signing-dry-run:
    name: Release Dry Run (signed)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write  # Cosign keyless signing of the snapshot checksums
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Download Go modules
        shell: bash
        run: |
          for attempt in 1 2 3; do
            if go mod download; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi
            sleep "$((attempt * 20))"
          done

      - name: Install UPX
        run: |
          UPX_VERSION="5.2.0"
          curl -fsSL "https://github.com/upx/upx/releases/download/v${UPX_VERSION}/upx-${UPX_VERSION}-amd64_linux.tar.xz" -o /tmp/upx.tar.xz
          tar -xJf /tmp/upx.tar.xz -C /tmp
          sudo install -m 755 "/tmp/upx-${UPX_VERSION}-amd64_linux/upx" /usr/local/bin/upx
          rm -rf /tmp/upx.tar.xz "/tmp/upx-${UPX_VERSION}-amd64_linux"
          upx --version

      - name: Install Cosign
        uses: sigstore/cosign-installer@v4.1.3
        with:
          cosign-release: v3.1.3

      - name: Run GoReleaser release dry run (signed)
        uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2.16"
          args: release --clean --snapshot
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GORELEASER_CURRENT_TAG: v0.0.0-ci
          HOMEBREW_TAP_TOKEN: "dry-run"
          WINGET_TOKEN: "dry-run"
