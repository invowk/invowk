name: CI

on:
  # None of this workflow's checks are required by branch protection, so both
  # push and pull_request can safely skip documentation-only diffs. Keep the
  # path lists in sync between the two triggers.
  push:
    branches:
      - main
    paths:
      - 'cmd/**'
      - 'internal/**'
      - 'pkg/**'
      - 'tests/**'
      - '*.go'
      - 'go.mod'
      - 'go.sum'
      - 'Makefile'
      - 'scripts/**'
      - 'default.pgo'
      - '.goreleaser.yaml'
      - '.github/workflows/ci.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'cmd/**'
      - 'internal/**'
      - 'pkg/**'
      - 'tests/**'
      - '*.go'
      - 'go.mod'
      - 'go.sum'
      - 'Makefile'
      - 'scripts/**'
      - 'default.pgo'
      - '.goreleaser.yaml'
      - '.github/workflows/ci.yml'
  # Release validation must always run in full, regardless of changed paths.
  release:
    types:
      - published
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Fall back to direct module fetches on transient Go proxy failures.
  GOPROXY: "https://proxy.golang.org|direct"

jobs:
  test:
    name: Test (${{ matrix.os }}${{ matrix.engine && format(' / {0}', matrix.engine) || '' }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    # No `checks: write` here: this job runs the pull request's code, on a
    # Dependabot pull request the updated dependency's, and a token that may
    # write checks would let that code create or rewrite a check named like a
    # required one. The `test-report` job below publishes the JUnit reports.
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          # Ubuntu with Docker (ubuntu-latest = ubuntu-24.04 as of 2026-03)
          - os: ubuntu-latest
            runner: ubuntu-latest
            engine: docker
            test-mode: full
            # restrict-tui-server-bind D2 row this engine must select:
            # 8 = rootful Docker, loopback + bridge gateway.
            tui-plan-row: "8"

          # Ubuntu with Podman
          - os: ubuntu-latest
            runner: ubuntu-latest
            engine: podman
            test-mode: full
            # restrict-tui-server-bind D2 row: 11 = rootless Podman with pasta.
            # The first run's "podman network backend" line (2026-11-15, run
            # 43677325230) reported true|pasta|false|/usr/bin/pasta.
            tui-plan-row: "11"

          # Windows (unit tests only - container runtime requires Linux)
          - os: windows
            runner: windows-latest
            engine: ""
            test-mode: short

          # macOS (unit tests only, no container engine)
          - os: macos
            runner: macos-15
            engine: ""
            test-mode: short

    steps:
      # Hygiene: no later step runs git against the remote, so the token
      # stays out of .git/config, where the code under test could read it.
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Download Go modules
        shell: bash
        run: |
          for attempt in 1 2 3; do
            if go mod download; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi
            sleep "$((attempt * 20))"
          done

      - name: Cache gotestsum
        id: cache-gotestsum
        uses: actions/cache@v6
        with:
          path: ~/go/bin/gotestsum${{ matrix.os == 'windows' && '.exe' || '' }}
          key: gotestsum-${{ runner.os }}-v1.13.0

      - name: Install gotestsum
        if: steps.cache-gotestsum.outputs.cache-hit != 'true'
        run: go install gotest.tools/gotestsum@v1.13.0

      - name: Verify gotestsum
        run: gotestsum --version

      # Engine isolation: mask the non-tested engine so AutoDetectEngine() picks
      # the correct one. Ubuntu runners have both Docker and Podman installed.
      # Fail-loud: verify the masked engine is no longer discoverable.
      - name: Mask Docker for Podman tests
        if: matrix.engine == 'podman' && startsWith(matrix.runner, 'ubuntu')
        run: |
          # Mask every PATH-resolvable install, not a hardcoded location —
          # runner images move engine binaries between /usr/bin and /usr/local/bin.
          for _ in 1 2 3 4 5; do
            binpath="$(command -v docker || true)"
            [ -z "$binpath" ] && break
            sudo mv "$binpath" "${binpath}.disabled"
            hash -r
          done
          if command -v docker &>/dev/null; then
            echo "::error::Docker is still on PATH after masking"
            exit 1
          fi

      - name: Mask Podman for Docker tests
        if: matrix.engine == 'docker' && startsWith(matrix.runner, 'ubuntu')
        run: |
          # Mask every PATH-resolvable install, not a hardcoded location —
          # runner images move engine binaries between /usr/bin and /usr/local/bin.
          for _ in 1 2 3 4 5; do
            binpath="$(command -v podman || true)"
            [ -z "$binpath" ] && break
            sudo mv "$binpath" "${binpath}.disabled"
            hash -r
          done
          if command -v podman &>/dev/null; then
            echo "::error::Podman is still on PATH after masking"
            exit 1
          fi

      # Podman setup for Ubuntu — fail-loud to surface daemon issues immediately.
      - name: Setup Podman (Ubuntu)
        if: matrix.engine == 'podman' && startsWith(matrix.runner, 'ubuntu')
        run: |
          podman --version
          systemctl --user start podman.socket
          systemctl --user is-active podman.socket
          # TUI exposure plan evidence (restrict-tui-server-bind task 5.1):
          # rootless|network cmd|remote|pasta executable (empty = no pasta).
          # Older Podman lacks some fields, so a template error must not fail the job.
          echo "podman network backend: $(podman info --format '{{.Host.Security.Rootless}}|{{.Host.RootlessNetworkCmd}}|{{.Host.ServiceIsRemote}}|{{.Host.Pasta.Executable}}' 2>&1 || true)"
          echo "pasta on PATH: $(command -v pasta || echo none)"

      # Docker setup verification for Ubuntu
      - name: Verify Docker (Ubuntu)
        if: matrix.engine == 'docker' && startsWith(matrix.runner, 'ubuntu')
        run: |
          docker --version
          docker info

      # Pre-pull base image to avoid network flakiness during container builds.
      # This removes the image-pull dependency from the critical path of test builds.
      - name: Pre-pull container test images
        if: matrix.engine != '' && startsWith(matrix.runner, 'ubuntu')
        run: ${{ matrix.engine }} pull debian:stable-slim

      # Run full tests except CLI integration tests.
      # CLI is split out below so the container CLI suite is no longer hidden
      # behind generic rerun-fails behavior.
      - name: Run tests (full, non-CLI)
        if: matrix.test-mode == 'full'
        shell: bash
        env:
          INVOWK_TEST_CONTAINER_PARALLEL: "2"
          INVOWK_TEST_TUI_PLAN_ROW: ${{ matrix.tui-plan-row }}
        run: |
          PACKAGES="$(go list ./... | grep -v '^github.com/invowk/invowk/tests/cli$' | grep -v '^github.com/invowk/invowk/internal/runtime$' | tr '\n' ' ')"
          gotestsum \
            --format testdox \
            --junitfile test-results.xml \
            --rerun-fails \
            --rerun-fails-max-failures 5 \
            --rerun-fails-report rerun-report.txt \
            --packages "$PACKAGES" \
            -- -race -timeout 15m -coverprofile=coverage.out

      - name: Run internal/runtime tests (full)
        if: matrix.test-mode == 'full'
        shell: bash
        env:
          INVOWK_TEST_CONTAINER_PARALLEL: "2"
        run: |
          gotestsum \
            --format testdox \
            --junitfile runtime-test-results.xml \
            --rerun-fails \
            --rerun-fails-max-failures 5 \
            --rerun-fails-report runtime-rerun-report.txt \
            --packages ./internal/runtime \
            -- -race -timeout 15m -coverprofile=runtime-coverage.out

      # The full legs are Linux, where the runner image ships tmux: a missing
      # tmux fails the TUI tmux tests here instead of skipping them.
      - name: Run CLI integration tests (full)
        if: matrix.test-mode == 'full'
        shell: bash
        env:
          INVOWK_TEST_CONTAINER_ENGINE: ${{ matrix.engine }}
          INVOWK_TEST_REQUIRE_TMUX: "1"
        run: |
          gotestsum \
            --format testdox \
            --junitfile cli-test-results.xml \
            --packages ./tests/cli/... \
            -- -race -timeout 10m -coverprofile=cli-coverage.out

      # Run short tests (unit tests only, no container dependencies).
      # Uses bash shell to avoid PowerShell parsing issues on Windows.
      - name: Run tests (short)
        if: matrix.test-mode == 'short'
        shell: bash
        run: |
          gotestsum \
            --format testdox \
            --junitfile test-results.xml \
            --rerun-fails \
            --rerun-fails-max-failures 3 \
            --rerun-fails-report rerun-report.txt \
            --packages ./... \
            -- -race -short -v -coverprofile=coverage.out

      # Run CLI integration tests on Windows/macOS
      # CLI tests use testscript with inline CUE and virtual runtime for cross-platform support.
      # Container tests auto-skip via [!container-available] guard.
      - name: Run CLI integration tests
        if: matrix.test-mode == 'short'
        shell: bash
        run: |
          gotestsum \
            --format testdox \
            --junitfile cli-test-results.xml \
            --packages ./tests/cli/... \
            -- -race -timeout 5m -coverprofile=cli-coverage.out

      # Benchmark smoke test (single ubuntu-latest leg only).
      # Ensures benchmarks stay compilable/runnable in regular CI without
      # adding heavy benchmark load to every matrix entry.
      - name: Run benchmark smoke tests
        if: matrix.runner == 'ubuntu-latest' && matrix.engine == 'docker'
        shell: bash
        run: |
          BENCH_REGEX='^Benchmark(CUEParsing|CUEParsingComplex|InvowkmodParsing|Discovery.*|ModuleValidation|FullPipeline)$'
          go test ./internal/benchmark -run=^$ -bench="$BENCH_REGEX" -benchmem -benchtime=1x -count=1

      # The POSIX script tests (scripts/script-tests.sh) run behind the
      # worktree-safety gate in lint.yml's "script tests (worktree-safety
      # gate)" job, on every PR; only the PowerShell ones run here.
      # Run PowerShell install script tests (PS 7.x/Core).
      - name: Run PowerShell install script tests (pwsh)
        if: matrix.os == 'windows'
        shell: pwsh
        run: ./scripts/test_install.ps1

      # Run PowerShell install script tests (Windows PowerShell 5.1).
      - name: Run PowerShell install script tests (powershell)
        if: matrix.os == 'windows'
        shell: powershell
        run: ./scripts/test_install.ps1

      - name: Merge coverage profiles
        if: matrix.runner == 'ubuntu-latest' && matrix.engine == 'docker'
        run: |
          # All profiles use the same -covermode (from go test defaults), so
          # raw concat is safe after stripping the duplicate mode: header line.
          if [ -f runtime-coverage.out ]; then
            tail -n +2 runtime-coverage.out >> coverage.out
          fi
          if [ -f cli-coverage.out ]; then
            tail -n +2 cli-coverage.out >> coverage.out
          fi

      # Upload test results (JUnit XML + rerun reports) for debugging and flake tracking
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ matrix.os }}-${{ matrix.engine || 'unit' }}
          path: |
            test-results.xml
            runtime-test-results.xml
            cli-test-results.xml
            rerun-report.txt
            runtime-rerun-report.txt
            cli-rerun-report.txt
          if-no-files-found: ignore
          retention-days: 30

      # Surface rerun reports as GitHub Actions warnings for flake visibility
      - name: Flag flaky tests
        if: always()
        shell: bash
        run: |
          for report in rerun-report.txt runtime-rerun-report.txt cli-rerun-report.txt; do
            if [ -s "$report" ]; then
              echo "::warning::Flaky tests detected (rerun report: $report):"
              while IFS= read -r line; do
                echo "::warning::  $line"
              done < "$report"
            fi
          done

      # Upload coverage
      - name: Upload coverage
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-${{ matrix.os }}-${{ matrix.engine || 'unit' }}
          path: coverage.out
          retention-days: 7

  # Render each test leg's JUnit results as a check with PR annotations
  # (`JUnit Report (...)`). The only job of this workflow that may write
  # checks, so it runs no pull request code: no checkout, no `run` step, only
  # the pinned report action on the XML files the test leg uploaded. Its
  # matrix lists the test job's legs (os, engine);
  # scripts/test_dependabot_gate.py fails when the two differ.
  test-report:
    name: Test Report (${{ matrix.os }}${{ matrix.engine && format(' / {0}', matrix.engine) || '' }})
    needs: test
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      checks: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            engine: docker
          - os: ubuntu-latest
            engine: podman
          - os: windows
            engine: ""
          - os: macos
            engine: ""
    steps:
      - name: Download test results
        uses: actions/download-artifact@v8
        with:
          name: test-results-${{ matrix.os }}-${{ matrix.engine || 'unit' }}
          path: test-results

      - name: Test Report
        uses: mikepenz/action-junit-report@v6
        with:
          report_paths: 'test-results/*.xml'
          check_name: JUnit Report (${{ matrix.os }}${{ matrix.engine && format(' / {0}', matrix.engine) || '' }})
          fail_on_failure: true
          check_retries: true
          flaky_summary: true
          include_passed: false

  # Build verification (ensures the binary compiles on all platforms)
  build:
    name: Build (${{ matrix.os }}/${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            arch: amd64
            runner: ubuntu-latest
          - os: linux
            arch: arm64
            runner: ubuntu-latest
          - os: darwin
            arch: amd64
            runner: macos-15-intel
          - os: darwin
            arch: arm64
            runner: macos-15
          - os: windows
            arch: amd64
            runner: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Download Go modules
        shell: bash
        run: |
          for attempt in 1 2 3; do
            if go mod download; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi
            sleep "$((attempt * 20))"
          done

      - name: Build
        env:
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
          GOAMD64: v3
          CGO_ENABLED: "0"
        run: go build -trimpath -ldflags="-s -w" -o invowk${{ matrix.os == 'windows' && '.exe' || '' }} .

      - name: Verify binary
        if: (matrix.os == 'linux' && matrix.arch == 'amd64') || matrix.os == 'darwin' || matrix.os == 'windows'
        run: ./invowk${{ matrix.os == 'windows' && '.exe' || '' }} --version
        shell: bash

  # PGO profile sanity and freshness checks.
  # On same-repo PRs that change hot-path files without default.pgo: regenerates
  # the profile, audits it and uploads it as the `pgo-profile` artifact; the
  # pgo-commit job below commits it to the PR branch.
  # On fork PRs: fails with instructions (nothing is committed to a fork).
  # On push/release: audit-only.
  # This job runs the pull request's code (make, go and the scripts), so its
  # token is read-only and is not persisted in .git/config.
  pgo-sanity:
    name: PGO Sanity
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      needs_refresh: ${{ steps.pgo-check.outputs.needs_refresh }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          # The default ref (a pull request's merge commit). pgo-commit takes
          # the head to commit on from the event, never from this job, so
          # nothing this job's code writes can choose it.
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Download Go modules
        shell: bash
        run: |
          for attempt in 1 2 3; do
            if go mod download; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi
            sleep "$((attempt * 20))"
          done

      - name: Audit committed PGO profile
        run: make pgo-audit

      - name: Check PGO freshness for parser/discovery changes
        id: pgo-check
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          BASE_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          changed_files="$(git diff --name-only "$PR_BASE_SHA" "$PR_HEAD_SHA")"

          echo "Changed files between base and head:"
          echo "$changed_files"

          hot_path_pattern='^(pkg/cueutil/|pkg/invowkfile/|pkg/invowkmod/|internal/discovery/)'
          prod_files="$(echo "$changed_files" | grep -Ev '_test\.go$' || true)"
          if [ -n "$prod_files" ] && echo "$prod_files" | grep -Eq "$hot_path_pattern"; then
            if ! echo "$changed_files" | grep -Eq '^default\.pgo$'; then
              if [ "$PR_HEAD_REPO" = "$BASE_REPO" ]; then
                echo "::warning::Hot-path files changed without PGO refresh — auto-regenerating."
                echo "needs_refresh=true" >> "$GITHUB_OUTPUT"
              else
                echo "::error::Hot-path files changed without PGO refresh."
                echo "::error::Fork PRs cannot be auto-fixed. Run 'make pgo-profile-parse-discovery' and commit default.pgo."
                exit 1
              fi
            else
              echo "PGO profile already updated in this PR."
              echo "needs_refresh=false" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "No hot-path production files changed."
            echo "needs_refresh=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Auto-regenerate PGO profile
        if: steps.pgo-check.outputs.needs_refresh == 'true'
        run: make pgo-profile-parse-discovery

      - name: Audit regenerated PGO profile
        if: steps.pgo-check.outputs.needs_refresh == 'true'
        run: make pgo-audit

      - name: Upload regenerated PGO profile
        if: steps.pgo-check.outputs.needs_refresh == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: pgo-profile
          path: default.pgo
          if-no-files-found: error
          retention-days: 1
          overwrite: true

  # Commits the profile that pgo-sanity regenerated to the PR's own branch.
  # It holds `contents: write`, so it executes no repository or pull request
  # code: no checkout, no `run` step that calls make, go or a script, only the
  # pinned download action and inline shell that checks the artifact and
  # calls the GitHub API. It never pushes anywhere but the PR's head branch.
  # The GraphQL createCommitOnBranch mutation creates a GitHub-signed commit
  # (direct git commits on CI runners are unsigned and blocked by the
  # required_signatures ruleset). It uses GITHUB_TOKEN, not an app token, so
  # the commit does NOT re-trigger CI (GitHub's anti-recursion protection);
  # pgo-sanity already audited the regenerated profile in this run.
  # scripts/test_dependabot_gate.py checks these properties.
  pgo-commit:
    name: PGO Profile Commit
    needs: pgo-sanity
    if: >-
      needs.pgo-sanity.outputs.needs_refresh == 'true'
      && github.event_name == 'pull_request'
      && github.event.pull_request.head.repo.full_name == github.repository
      && github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Download regenerated PGO profile
        uses: actions/download-artifact@v8
        with:
          name: pgo-profile
          path: ${{ runner.temp }}/pgo-profile

      - name: Verify the artifact
        shell: bash
        env:
          PROFILE_DIR: ${{ runner.temp }}/pgo-profile
        run: |
          set -euo pipefail

          # Exactly one regular file named default.pgo, of a sane size, gzip
          # compressed like every profile `go test -cpuprofile` writes.
          entries="$(find "$PROFILE_DIR" -mindepth 1 -printf '%P\n')"
          if [ "$entries" != "default.pgo" ]; then
            echo "::error::The pgo-profile artifact must hold only default.pgo; it holds: $(echo "$entries" | tr '\n' ' ')"
            exit 1
          fi
          profile="$PROFILE_DIR/default.pgo"
          if [ -L "$profile" ] || [ ! -f "$profile" ]; then
            echo "::error::default.pgo in the artifact is not a regular file."
            exit 1
          fi
          size="$(stat -c %s "$profile")"
          if [ "$size" -lt 1024 ] || [ "$size" -gt 8388608 ]; then
            echo "::error::default.pgo is $size bytes; expected 1 KiB to 8 MiB."
            exit 1
          fi
          magic="$(head -c 2 "$profile" | od -An -tx1 | tr -d ' \n')"
          if [ "$magic" != "1f8b" ]; then
            echo "::error::default.pgo is not gzip compressed (starts with $magic)."
            exit 1
          fi
          echo "default.pgo: $size bytes"

      - name: Commit PGO profile (verified)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_BRANCH: ${{ github.head_ref }}
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
          PROFILE: ${{ runner.temp }}/pgo-profile/default.pgo
        run: |
          set -euo pipefail

          if ! [[ "$EXPECTED_HEAD" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::the event carries no pull request head: '$EXPECTED_HEAD'"
            exit 1
          fi

          # Commit only on top of the head the profile was generated from.
          # A branch that moved since is skipped, never overwritten; one that
          # moves during the commit fails the mutation (expectedHeadOid), and
          # the next run regenerates the profile for the new head.
          # shellcheck disable=SC2016 # GraphQL variables, not shell ones
          CURRENT_HEAD=$(gh api graphql \
            -f query='query ($owner: String!, $name: String!, $ref: String!) {
              repository(owner: $owner, name: $name) { ref(qualifiedName: $ref) { target { oid } } }
            }' \
            -f owner="${GITHUB_REPOSITORY%%/*}" \
            -f name="${GITHUB_REPOSITORY#*/}" \
            -f ref="refs/heads/$HEAD_BRANCH" \
            --jq '.data.repository.ref.target.oid // ""')
          if [ "$CURRENT_HEAD" != "$EXPECTED_HEAD" ]; then
            echo "::notice::$HEAD_BRANCH is at ${CURRENT_HEAD:-nothing}, not $EXPECTED_HEAD where PGO Sanity ran; skipping the commit."
            exit 0
          fi

          # Base64-encode the regenerated PGO profile.
          B64_FILE=$(mktemp)
          base64 -w 0 < "$PROFILE" > "$B64_FILE"

          # shellcheck disable=SC2016 # GraphQL variables, not shell ones
          QUERY='
            mutation ($input: CreateCommitOnBranchInput!) {
              createCommitOnBranch(input: $input) {
                commit { oid url }
              }
            }'

          # expectedHeadOid makes GitHub refuse the commit if the branch
          # moves between the check above and this call.
          RESULT=$(jq -n \
            --arg query "$QUERY" \
            --arg repo "$GITHUB_REPOSITORY" \
            --arg branch "$HEAD_BRANCH" \
            --arg headline "chore(pgo): auto-regenerate profile for hot-path changes" \
            --arg oid "$EXPECTED_HEAD" \
            --rawfile contents "$B64_FILE" \
            '{
              query: $query,
              variables: {
                input: {
                  branch: {
                    repositoryNameWithOwner: $repo,
                    branchName: $branch
                  },
                  message: { headline: $headline },
                  fileChanges: {
                    additions: [{path: "default.pgo", contents: $contents}]
                  },
                  expectedHeadOid: $oid
                }
              }
            }' | gh api graphql --input -)

          rm -f "$B64_FILE"
          if [ "$(echo "$RESULT" | jq '.errors // [] | length')" != "0" ] \
            || [ -z "$(echo "$RESULT" | jq -r '.data.createCommitOnBranch.commit.oid // empty')" ]; then
            echo "::error::createCommitOnBranch returned no commit: $RESULT"
            exit 1
          fi
          echo "$RESULT" | jq -r '.data.createCommitOnBranch.commit | "Created verified commit \(.oid)\n\(.url)"'

  # License header check
  license-check:
    name: License Headers
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Check SPDX headers
        run: make license-check

  # Vulnerability scanning (checks Go vulnerability database)
  govulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Download Go modules
        shell: bash
        run: |
          while IFS= read -r mod_file; do
            mod_dir="$(dirname "$mod_file")"
            echo "Downloading Go modules: $mod_dir"
            for attempt in 1 2 3; do
              if (cd "$mod_dir" && go mod download); then
                break
              fi
              if [ "$attempt" -eq 3 ]; then
                exit 1
              fi
              sleep "$((attempt * 20))"
            done
          done < <(git ls-files 'go.mod' '*/go.mod')

      - name: Install govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.7.0
          govulncheck -version

      - name: Run govulncheck
        run: make vulncheck

  # GoReleaser dry-run (validates configuration)
  goreleaser-check:
    name: GoReleaser Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Download Go modules
        shell: bash
        run: |
          for attempt in 1 2 3; do
            if go mod download; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi
            sleep "$((attempt * 20))"
          done

      - name: Check GoReleaser config
        uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2.16"
          args: check

  # Release dry run: exercises the release-only path on every push/PR so
  # compression hooks and GoReleaser packaging do not first meet CI on tag
  # day. Release performance tracking is covered by the dedicated release
  # workflow once a real tag exists. The check (`Release Dry Run`) is
  # required for Dependabot gomod updates: keep the name. The job builds the
  # pull request's code, so it holds no write grant and skips signing on
  # every event; release-signing.yml, which no pull request can start, runs
  # the signed snapshot with `id-token: write`.
  release-dry-run:
    name: Release Dry Run
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Download Go modules
        shell: bash
        run: |
          for attempt in 1 2 3; do
            if go mod download; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi
            sleep "$((attempt * 20))"
          done

      - name: Install UPX
        run: |
          UPX_VERSION="5.2.0"
          curl -fsSL "https://github.com/upx/upx/releases/download/v${UPX_VERSION}/upx-${UPX_VERSION}-amd64_linux.tar.xz" -o /tmp/upx.tar.xz
          tar -xJf /tmp/upx.tar.xz -C /tmp
          sudo install -m 755 "/tmp/upx-${UPX_VERSION}-amd64_linux/upx" /usr/local/bin/upx
          rm -rf /tmp/upx.tar.xz "/tmp/upx-${UPX_VERSION}-amd64_linux"
          upx --version

      - name: Run GoReleaser release dry run (unsigned)
        uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2.16"
          args: release --clean --snapshot --skip=sign
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GORELEASER_CURRENT_TAG: v0.0.0-ci
          HOMEBREW_TAP_TOKEN: "dry-run"
          WINGET_TOKEN: "dry-run"
