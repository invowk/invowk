name: Mutation Testing

on:
  workflow_dispatch:
    inputs:
      module:
        description: "Mutation module profile to run (root target set only)"
        type: choice
        default: root
        options:
          - root
      target_set:
        description: "Mutation targets: curated root packages, or the functions named by the formal models' correspondence tables"
        type: choice
        default: root
        options:
          - root
          - formal-bindings

concurrency:
  group: mutation-testing-${{ github.ref }}
  cancel-in-progress: true

env:
  GOPROXY: "https://proxy.golang.org|direct"
  MUTATION_WORKERS: "2"

jobs:
  manual-full:
    name: Manual full advisory (${{ github.event.inputs.target_set }})
    runs-on: ubuntu-latest
    # The formal-bindings executor forces one worker and replays golden vectors
    # without -short; raise this budget (not -short) if a run outgrows it.
    timeout-minutes: ${{ github.event.inputs.target_set == 'formal-bindings' && 90 || 60 }}
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Download Go modules
        run: go mod download

      - name: Run full mutation profile
        env:
          SELECTED_MODULE: ${{ github.event.inputs.module }}
          SELECTED_TARGET_SET: ${{ github.event.inputs.target_set }}
        run: |
          if [ "$SELECTED_TARGET_SET" = "formal-bindings" ]; then
            make mutation-formal MUTATION_MODE=advisory
          else
            make mutation-full MUTATION_MODULE="$SELECTED_MODULE" MUTATION_MODE=advisory
          fi

      - name: Upload mutation reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mutation-full-${{ github.event.inputs.target_set == 'formal-bindings' && 'formal-bindings' || github.event.inputs.module }}
          path: artifacts/mutation/full/${{ github.event.inputs.target_set == 'formal-bindings' && 'formal-bindings' || github.event.inputs.module }}/
          if-no-files-found: warn
