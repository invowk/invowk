name: Lint

on:
  push:
    branches:
      - main
    paths:
      - 'cmd/**'
      - 'internal/**'
      - 'pkg/**'
      - 'tests/**'
      - '*.go'
      - 'go.mod'
      - 'go.sum'
      - '.goplint/**'
      - 'scripts/goplint.sh'
      - 'scripts/goplint-consumer-smoke.sh'
      - 'scripts/goplint-consumer-routed.sh'
      - '.golangci.toml'
      - 'sonar-project.properties'
      - '.sonarcloud.properties'
      - '.pre-commit-config.yaml'
      - 'Makefile'
      - 'AGENTS.md'
      - '.agents/**'
      - 'scripts/check-agent-docs.sh'
      - 'scripts/check-file-length.sh'
      - 'scripts/golangci-lint.sh'
      - 'scripts/test_golangci_lint.sh'
      - '.github/workflows/**'
      - '.github/workflows/lint.yml'
      - 'openspec/specs/lint-tooling-quality-gates/**'
  pull_request:
    branches:
      - main
    paths:
      - 'cmd/**'
      - 'internal/**'
      - 'pkg/**'
      - 'tests/**'
      - '*.go'
      - 'go.mod'
      - 'go.sum'
      - '.goplint/**'
      - 'scripts/goplint.sh'
      - 'scripts/goplint-consumer-smoke.sh'
      - 'scripts/goplint-consumer-routed.sh'
      - '.golangci.toml'
      - 'sonar-project.properties'
      - '.sonarcloud.properties'
      - '.pre-commit-config.yaml'
      - 'Makefile'
      - 'AGENTS.md'
      - '.agents/**'
      - 'scripts/check-agent-docs.sh'
      - 'scripts/check-file-length.sh'
      - 'scripts/golangci-lint.sh'
      - 'scripts/test_golangci_lint.sh'
      - '.github/workflows/**'
      - '.github/workflows/lint.yml'
      - 'openspec/specs/lint-tooling-quality-gates/**'
  # Release validation must always run in full, regardless of changed paths.
  release:
    types:
      - published
  schedule:
    - cron: '17 5 * * 0'
  workflow_dispatch:

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  agent-docs:
    name: agent docs integrity
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Check AGENTS/rules/skills integrity
        run: make check-agent-docs

  golangci-lint:
    name: normalized golangci-lint gates
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify normalized golangci-lint version
        run: ./scripts/golangci-lint.sh version

      - name: Test normalized golangci-lint wrapper
        run: bash scripts/test_golangci_lint.sh

      - name: Run full lint gate
        run: make lint

  goplint-consumer:
    name: goplint consumer gates
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      # One canonical repository scan serves every consumer verdict below.
      GOPLINT_REPOSITORY_AUDIT_PATH: ${{ github.workspace }}/artifacts/goplint/repository-audit.json
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify pinned goplint version
        run: ./scripts/goplint.sh version

      - name: Produce the canonical repository audit
        run: |
          mkdir -p artifacts/goplint
          make check-goplint-repository-audit

      - name: Check baseline regressions
        run: make check-baseline

      - name: Audit exception governance
        run: make check-goplint-exceptions

      - name: Run the blocking full scan
        run: make check-goplint-full-scan

      - name: Run the consumer performance smoke
        run: make check-goplint-performance-smoke

  file-length:
    name: file length gate (1000 lines)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Check file lengths
        run: ./scripts/check-file-length.sh
