# SPDX-License-Identifier: MPL-2.0
#
# Triage ledger for the formal-bindings mutation baseline
# (tools/mutation/baselines/formal-bindings-baseline.json).
#
# go-mutesting's baseline stores only {id, file, mutator, line}; the reason a
# survivor is accepted lives here. `python3 scripts/formal_mutation.py triage
# --check` (run by `make test-scripts` and `make mutation-formal-baseline-update`)
# fails unless:
#   - the [[survivor]] ids equal the baseline ids;
#   - model + element + symbol identify a correspondence row, and file matches it;
#   - binding-gap and model-gap entries name a follow_up (a change or a task);
#   - defect entries name, as follow_up, a finding id declared by a `finding =`
#     command in formal/manifest.toml;
#   - an abstraction reason, whitespace-collapsed, is a substring of the row's
#     abstraction cell;
#   - every id has at least two `escaped` records in formal-bindings-reruns.jsonl
#     whose `digest` equals its evidence digest (the mutant's own baseline
#     `digest` after a partial refresh, else the baseline's input digest), and
#     no other status there (the digest covers the target files, the files
#     declaring their killer tests, and any planned model golden-vector files, so
#     it survives squash merges);
#   - the anchor (`removed` and `added`, the exact diff lines) hashes, with the
#     file and the baseline's mutator, to the id (go-mutesting's MutantID);
#   - the symbol still names a function in `file`, and the anchor lines
#     (`removed`, or `context` when it removes no line), verbatim (indentation
#     included), still appear in order starting inside that function's body.
#     Survivors in formal/manifest.toml [triage] orphaned_survivors are not
#     anchored; ids in [triage] stale_survivors (shrink-only) are reported
#     instead of failing, and fail once they pass.
#
# Classes:
#   equivalent   the mutant cannot change observable behaviour
#   abstraction  the row's abstraction cell states why the model ignores it
#   binding-gap  the model states the property but the binding misses it
#   model-gap    the model does not state the property
#   defect       a strengthened binding fails on unmodified code (a finding)
#
# [[survivor]] fields: id, file, symbol, model, element, class, reason, follow_up,
# removed, added, and context (only for a mutant that removes no line: the
# nearest preceding non-blank unchanged line before its first added line).
#
# [[closed]] records a gap closed by a stronger binding or a new model property:
# the mutant left the baseline, and its id must appear in the model's
# `calibration` text in formal/manifest.toml. Fields: id, model.
#
# First run (2026-09-25): every survivor is a binding-gap deferred to
# tasks/next/formal-binding-gaps.md, which groups them by function; per-mutant
# classification (equivalent or abstraction) is part of that follow-up.
#
# refresh-anchors-mutation-ledger (2026-11-19): every survivor except the
# orphans is anchored from a report-only run on 567e7b00, and the 22 stale
# standardVirtualAnchorsForOS entries were replaced by the 5 windows-case
# survivors of its new body (419 -> 402), whose baseline entries carry their
# own evidence digest.

