# SPDX-License-Identifier: MPL-2.0
#
# Formal-verification manifest read by scripts/formal.py.
#
# Every command declares its expected verdict:
#   pass            - Alloy check with no counterexample / TLC run with no error
#   counterexample  - a mutant or a recorded finding; the checker must find one
#   instance        - Alloy run that must be satisfiable (non-vacuity, witness)
# A safety command (expect = "pass" with a property) needs at least one
# command with mutant_of pointing at it, and Alloy checks need an antecedent.
#
# Alloy commands are declared only here: `body` is the formula and `scope`
# overrides the model's default `scope`. The runner renders each one as
# `name: run|check { body } for scope expect 0|1` (instance -> run, pass -> 0)
# into artifacts/formal/<Model>/<Model>.als. TLC configurations are rendered
# from [model.constants] and each command's `constants`, `spec`, and
# `temporal`. Unknown keys, and keys for the other tool, are rejected.

[tools.alloy]
version = "6.2.0"
jar = "org.alloytools.alloy.dist.jar"
url = "https://github.com/AlloyTools/org.alloytools.alloy/releases/download/v6.2.0/org.alloytools.alloy.dist.jar"
# First-download checksum from the official release (GitHub publishes no digest for this asset).
sha256 = "6b8c1cb5bc93bedfc7c61435c4e1ab6e688a242dc702a394628d9a9801edb78d"

[tools.tla]
version = "1.7.4"
jar = "tla2tools.jar"
url = "https://github.com/tlaplus/tlaplus/releases/download/v1.7.4/tla2tools.jar"
# Matches the checksum independently recorded by the Lushtext evaluation for the same release.
sha256 = "936a262061c914694dfd669a543be24573c45d5aa0ff20a8b96b23d01e050e88"

# CI classification and budgets (see formal/README.md, "CI budgets").
#
# `scripts/formal.py affected` runs the full lane on a pull request only when a
# changed path matches one of these patterns under fnmatch.fnmatchcase, where
# `*` also matches `/`. scripts/test_formal.py fails unless the patterns cover
# every correspondence-table file, binding-test file, trace package, and golden
# output. Code a model depends on that no table names is the author's to add.
[ci]
paths = [
    ".github/workflows/formal-verification.yml",
    "Makefile",
    "formal/**",
    "go.mod",
    "go.sum",
    "internal/app/deps/**",
    "internal/app/modulecache/**",
    "internal/app/moduleops/**",
    "internal/app/modulesync/**",
    "internal/audit/**",
    "internal/container/retry*.go",
    "internal/core/serverbase/**",
    "internal/discovery/**",
    "internal/provision/**",
    "internal/runtime/**",
    "internal/sshserver/**",
    "internal/testutil/**",
    "internal/watch/**",
    "pkg/fspath/**",
    "pkg/invowkfile/**",
    "pkg/invowkmod/**",
    "scripts/formal.py",
    "scripts/formal_promotion_gate.py",
    "scripts/test_formal.py",
    "scripts/test_formal_promotion_gate.py",
]

# How the budgets were derived. Soft budgets (budget_seconds on every [[model]]
# and [[trace]]) are per-model summed checker seconds; an overrun only warns.
# `ci`: ceil(soft_headroom x max CI seconds); `local` (provisional, a ::notice::
# in CI): ceil(local_headroom x local seconds). Hard budgets are the workflow's
# step timeout-minutes: max(2, ceil(hard_headroom x max CI step seconds / 60)).
# The runner does not print per-model times in the PR runs below (block-buffered
# output), so every soft budget is still `local`; re-measure from three
# workflow_dispatch runs on main after merge (promote-formal-ci-gate task 2.5).
[ci.budget]
soft_headroom = 1.5
local_headroom = 3
hard_headroom = 4
measured_on = "2026-09-25"
# workflow_dispatch runs on main b5f86f59 whose step and per-model times set the
# budgets (Check models max 376 s, Trace validation 170 s, Replay 22 s, Deep
# property tests 12 s).
ci_runs = [36203072183, 36203079356, 36203087452]
command_count = 174

[[model]]
name = "ScopeConstruction"
tool = "alloy"
file = "formal/alloy/ScopeConstruction.als"
budget_seconds = 174  # 1.5 x 115.6s CI max (3 dispatch runs)
budget_source = "ci"
scope = "4 but 3 Key, 3 Entry"  # default for every command below
calibration = """2026-09-24: the golden vectors (116928 exhaustive instances) and the rapid \
intent test each detect all five seeded code defects: direct dependency ignoring \
SourceID, lock match ignoring command_source_id, every module treated as global, \
same-module check ignoring SourceID, and any requires admitting all modules. \
Excluding Explicit sources from the golden scope hid the first and fourth; the \
golden command therefore keeps them."""

[model.golden]
command = "golden"
output = "internal/app/deps/testdata/formal/scope_construction_golden.json.gz"

[[model.command]]
name = "allowedTargetsBounded"
body = "discoveryFacts implies boundedProp"
expect = "pass"
property = "boundedProp"
antecedent = "anteBounded"

[[model.command]]
name = "anteBounded"
body = "discoveryFacts and some t: Cmd | allowedImpl[t] and t != Caller.self"
expect = "instance"

[[model.command]]
name = "allowedTargetsComplete"
body = "discoveryFacts implies completeProp"
expect = "pass"
property = "completeProp"
antecedent = "anteComplete"

[[model.command]]
name = "anteComplete"
body = "discoveryFacts and some t: Cmd | intendedAllowed[t] and t != Caller.self"
expect = "instance"

[[model.command]]
name = "rootDenied"
body = "discoveryFacts implies rootDeniedProp"
expect = "pass"
property = "rootDeniedProp"
antecedent = "anteRoot"

[[model.command]]
name = "anteRoot"
body = "discoveryFacts and some t: Cmd | t.src = RootSrc"
expect = "instance"

[[model.command]]
name = "localBranchDead"
body = "discoveryFacts implies localBranchDeadProp"
expect = "pass"
property = "localBranchDeadProp"
antecedent = "anteLocal"

[[model.command]]
name = "anteLocal"
body = "discoveryFacts"
expect = "instance"

# Rejecting mutants: each drops one discovery guarantee and must break the property.
[[model.command]]
name = "mutantNoSrcUnique"
body = "discoveryFactsNoSrcUnique implies boundedProp"
expect = "counterexample"
property = "boundedProp"
mutant_of = "allowedTargetsBounded"

[[model.command]]
name = "mutantEmptySrc"
body = "discoveryFactsEmptySrc implies boundedProp"
expect = "counterexample"
property = "boundedProp"
mutant_of = "allowedTargetsBounded"

[[model.command]]
name = "mutantRootNotReserved"
body = "discoveryFactsRootNotReserved implies rootDeniedProp"
expect = "counterexample"
property = "rootDeniedProp"
mutant_of = "rootDenied"

[[model.command]]
name = "mutantLocalEmptySrc"
body = "discoveryFactsEmptySrc implies localBranchDeadProp"
expect = "counterexample"
property = "localBranchDeadProp"
mutant_of = "localBranchDead"

[[model.command]]
name = "mutantCompleteEmptySrc"
body = "discoveryFactsEmptySrc implies completeProp"
expect = "counterexample"
property = "completeProp"
mutant_of = "allowedTargetsComplete"

# Witnesses: situations the model claims to cover must be reachable.
[[model.command]]
name = "witnessGlobalChild"
body = """
discoveryFacts
some t: Cmd | some t.childOf and allowedImpl[t] and not ownModule[t] and not declaredLocked[t.mod, t.src]"""
expect = "instance"
witness = true

[[model.command]]
name = "witnessDirectDependency"
body = """
discoveryFacts
some t: Cmd | t not in GlobalCmd and not ownModule[t] and allowedImpl[t]"""
expect = "instance"
witness = true

[[model.command]]
name = "witnessDeniedModule"
body = """
discoveryFacts
some t: Cmd | some t.mod and not allowedImpl[t]"""
expect = "instance"
witness = true

[[model.command]]
name = "witnessSharedModuleID"
body = """
discoveryFacts
some disj a, b: Cmd | some a.mod and a.mod = b.mod and allowedImpl[a] and not allowedImpl[b]"""
expect = "instance"
witness = true

# Golden vectors: every instance at a small scope, with the implementation's
# decision recorded in Caller.allowedSet, replayed against the real Go code.
# noJunk (in the model) excludes atoms that cannot influence a decision.
[[model.command]]
name = "golden"
body = """
discoveryFacts
Caller.allowedSet = { t: Cmd | allowedImpl[t] }
noJunk"""
scope = "3 but 2 Mod, 3 Src, 1 Key, 1 Entry"
expect = "instance"

