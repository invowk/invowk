# SPDX-License-Identifier: MPL-2.0
#
# Formal-verification manifest read by scripts/formal.py.
#
# Every command declares its expected verdict:
#   pass            - Alloy check with no counterexample / TLC run with no error
#   counterexample  - a mutant or a recorded finding; the checker must find one
#   instance        - Alloy run that must be satisfiable (non-vacuity, witness)
# A safety command (expect = "pass" with a property) needs at least one
# command with mutant_of pointing at it, and Alloy checks need an antecedent.
#
# Alloy commands are declared only here: `body` is the formula and `scope`
# overrides the model's default `scope`. The runner renders each one as
# `name: run|check { body } for scope expect 0|1` (instance -> run, pass -> 0)
# into artifacts/formal/<Model>/<Model>.als. TLC configurations are rendered
# from [model.constants] and each command's `constants`, `spec`, and
# `temporal`. Unknown keys, and keys for the other tool, are rejected.

[tools.alloy]
version = "6.2.0"
jar = "org.alloytools.alloy.dist.jar"
url = "https://github.com/AlloyTools/org.alloytools.alloy/releases/download/v6.2.0/org.alloytools.alloy.dist.jar"
# First-download checksum from the official release (GitHub publishes no digest for this asset).
sha256 = "6b8c1cb5bc93bedfc7c61435c4e1ab6e688a242dc702a394628d9a9801edb78d"

[tools.tla]
version = "1.7.4"
jar = "tla2tools.jar"
url = "https://github.com/tlaplus/tlaplus/releases/download/v1.7.4/tla2tools.jar"
# Matches the checksum independently recorded by the Lushtext evaluation for the same release.
sha256 = "936a262061c914694dfd669a543be24573c45d5aa0ff20a8b96b23d01e050e88"

# CI classification and budgets (see formal/README.md, "CI budgets").
#
# `scripts/formal.py affected` runs the full lane on a pull request only when a
# changed path matches one of these patterns under fnmatch.fnmatchcase, where
# `*` also matches `/`. scripts/test_formal.py fails unless the patterns cover
# every correspondence-table file, binding-test file, trace package, and golden
# output. Code a model depends on that no table names is the author's to add.
[ci]
paths = [
    ".github/workflows/formal-verification.yml",
    "Makefile",
    "formal/**",
    "go.mod",
    "go.sum",
    "internal/app/deps/**",
    "internal/app/modulecache/**",
    "internal/app/moduleops/**",
    "internal/app/modulesync/**",
    "internal/audit/**",
    "internal/container/retry*.go",
    "internal/core/serverbase/**",
    "internal/discovery/**",
    "internal/modulelock/**",
    "internal/provision/**",
    "internal/runtime/**",
    "internal/sshserver/**",
    "internal/testutil/**",
    "internal/watch/**",
    "pkg/fspath/**",
    "pkg/invowkfile/**",
    "pkg/invowkmod/**",
    "scripts/ci-triage-base.sh",
    "scripts/formal.py",
    "scripts/formal_mutation.py",
    "scripts/formal_promotion_gate.py",
    "scripts/test_formal.py",
    "scripts/test_formal_mutation.py",
    "scripts/test_formal_promotion_gate.py",
    "tools/mutation/baselines/formal-bindings-baseline.json",
    "tools/mutation/triage/**",
]

# How the budgets were derived. Soft budgets (budget_seconds on every [[model]]
# and [[trace]]) are per-model summed checker seconds; an overrun only warns.
# `ci`: ceil(soft_headroom x max CI seconds); `local` (provisional, a ::notice::
# in CI): ceil(local_headroom x local seconds). Hard budgets are the workflow's
# step timeout-minutes: max(2, ceil(hard_headroom x max CI step seconds / 60)).
# The runner does not print per-model times in the PR runs below (block-buffered
# output), so every soft budget is still `local`; re-measure from three
# workflow_dispatch runs on main after merge (promote-formal-ci-gate task 2.5).
[ci.budget]
soft_headroom = 1.5
local_headroom = 3
hard_headroom = 4
measured_on = "2026-09-25"
# workflow_dispatch runs on main b5f86f59 whose step and per-model times set the
# budgets (Check models max 376 s, Trace validation 170 s, Replay 22 s, Deep
# property tests 12 s).
ci_runs = [36203072183, 36203079356, 36203087452]
command_count = 190

# Binding reach gate (`make formal-reach`, scripts/formal_mutation.py reach):
# every killer test of every bound correspondence row must execute at least one
# statement of the row's function under a coverage profile. Soft budget:
# ceil(local_headroom x local seconds); the CI step's timeout-minutes is the
# hard limit (design D3 of the harden-formal-instruments change).
[reach]
budget_seconds = 36
budget_source = "local"
calibration = """
2026-11-14, before any rebinding (tree c0a000da plus the gate): the gate fails
and names exactly the eight (row, killer) pairs the coverage prototype found,
with no tooling errors. 48 of 56 (row, killer, function) triples reached, 23
killers, 51 unbound rows. Unreached, each executing 0 statements:
HostCallbackToken Auth (Server.ValidateToken, 0/10) by
TestHostCallbackToken_LifecycleMatchesModel; ModulePathContainment
unpackRejectsEscape (validateDestinationPath, 0/4), readOp (LoadEnvFile, 0/14;
CustomCheckScript.ResolveWithFSAndModule, 0/15) and workdirCwd
(Invowkfile.GetEffectiveWorkDir, 0/20) by TestModulePathContainment_GoldenVectors;
VirtualPathHarness allowedRoots (newVirtualPathResolverForFilesystem, 0/12),
anchors (standardVirtualAnchorsForOS, 0/21) and access
(VirtualFilesystemConfig.EffectiveAccess, 0/1) by
TestVirtualPathHarness_GoldenVectors. Wall time 11.8 s with a cold coverage
build (4.8-5.0 s warm), 16 jobs, so budget_seconds = ceil(3 x 11.8) = 36.
After rebinding (same day): the gate passes, 53 of 53 triples reached, 24
killers, 54 unbound rows; Auth, unpackRejectsEscape and anchors are listed as
no-binding. Seeded reach regression: replacing the LoadEnvFile call in the
golden's env replay with a stand-in fails exactly ModulePathContainment readOp
-> LoadEnvFile (0 of 14 statements); reverted. Wall time 3.1-6.7 s warm, under
the cold-build figure the budget uses, so the step (6 min) and job (52 min)
timeouts of design D3 stand.
Round 5 (same day, decisions 14 and 15): anchors binds
TestVirtualPathHarness_RootConstruction, and classify_rows treats a symbol that
names no function as type-symbol whether or not it is bound. The gate passes,
54 of 54 triples reached (anchors -> standardVirtualAnchorsForOS by
TestVirtualPathHarness_RootConstruction), 24 killers, 53 unbound rows (19
no-binding, among them Auth and unpackRejectsEscape; 34 by design). Wall time
5.6 s warm.
First CI sample (decision 16): PR run 43657442830, Binding reach passed, 53 of
53 triples, timing reach 37.1 s, a soft overrun of budget_seconds = 36 (local).
It stays local until three CI runs exist; the step timeout is the larger of
max(2, ceil(4 x 2 x 11.8 / 60)) = 2 and ceil(4 x 37.1 / 60) = 3 minutes
(decision 33).
"""

# Correspondence rows whose element cell's leading identifier is not in the
# model source (comments stripped) nor in a manifest command name or body of
# that model. These 34 pairs (38 rows) are naming drift recorded when
# scripts/formal.py correspondence gained the element check (2026-11-14,
# harden-formal-instruments decisions 7 and 10). The list only shrinks: a new
# unresolved row fails, and a listed pair that resolves or names no row fails as
# stale. The survivor-triage follow-up renames the elements, re-keys the
# ledger, and empties it.
[correspondence]
unresolved_elements = [
    "LockIdentity: evaluation",
    "Serverbase: State",
    "AtomicWrite: steps",
    "AtomicWrite: cleanup",
    "AtomicWrite: caller",
    "HostCallbackToken: Generate",
    "HostCallbackToken: Revoke",
    "Watch: fire goroutine",
    "Watch: backend",
    "ModulePathContainment: readOp",
    "ModulePathContainment: workdirCwd",
    "ModulePathContainment: copySkipsInnerLinks",
    "ModulePathContainment: hashSkipsLinks",
    "ModulePathContainment: unpackRejectsEscape",
    "ModulePathContainment: probeF16",
    "VirtualPathHarness: pathWithin",
    "VirtualPathHarness: allowedRoots",
    "VirtualPathHarness: anchors",
    "VirtualPathHarness: validate",
]

# Binding gaps (rows with no binding that name a function) and ledger survivors
# whose row is unbound (orphaned: their function is no longer a mutation target).
# Seeded on 2026-11-14 (harden-formal-instruments decisions 9 and 15, design D13)
# with 19 binding gaps and the 20 survivors of the two rows the change unbinds
# (Auth 8, unpackRejectsEscape 12). Rows unbound by design (no-symbol,
# type-symbol, trace-only, characterisation-only) are derived and reported by
# `scripts/formal_mutation.py triage --check`, never listed. The check fails on a
# binding gap or orphan that is not listed, on a listed entry that no longer
# applies, and on any entry here or in [correspondence] unresolved_elements that
# the base commit does not list (base: --base, else INVOWK_TRIAGE_BASE, else the
# merge-base with origin/main; CI sets it with scripts/ci-triage-base.sh). The
# survivor-triage follow-up binds the gaps and empties orphaned_survivors.
#
# stale_survivors (refresh-anchors-mutation-ledger, 2026-11-19, design D5):
# ledger survivors whose anchor (`removed`/`added`, or `context`) no longer
# hashes to the id or no longer appears in its symbol's current body, and that
# the seeding change did not refresh. A listed id is exempt from that check and
# reported; a listed id that passes it, or left the ledger, fails as stale. The
# key is required. Seeded from a base that has the three lists above but not
# this one; after that it only shrinks. A change that rewrites a bound function
# refreshes its survivors (formal-verification skill) instead of listing them.
[triage]
binding_gaps = [
    { model = "AtomicWrite", element = "caller", symbol = "LockFile.Save" },
    { model = "ConcurrentModuleEdits", element = "VendorRemove, VendorCopy", symbol = "VendorModules" },
    { model = "ConcurrentModuleEdits", element = "WriteMod add", symbol = "AddRequirement" },
    { model = "ConcurrentModuleEdits", element = "WriteMod remove", symbol = "RemoveRequirement" },
    { model = "DependencyClosure", element = "Mod.key", symbol = "ModuleRef.Key" },
    { model = "DependencyClosure", element = "resolved", symbol = "Resolver.resolveAll" },
    { model = "HostCallbackToken", element = "Auth", symbol = "Server.ValidateToken" },
    { model = "HostCallbackToken", element = "End paths", symbol = "ContainerRuntime.prepareContainerExecution" },
    { model = "LockIdentity", element = "v2Parse", symbol = "parseLockFile" },
    { model = "ModulePathContainment", element = "unpackRejectsEscape", symbol = "validateDestinationPath" },
    { model = "ScopeConstruction", element = "modUnlessExplicit", symbol = "CheckModuleCollisions" },
    { model = "ScopeConstruction", element = "moduleSourcesHaveIDs", symbol = "moduleIdentityFor" },
    { model = "ScopeConstruction", element = "srcUnique", symbol = "CheckModuleCollisions" },
]
orphaned_survivors = [
    "0087737c1ae08d3106d06a71d0eaab0d",
    "055592d8fb48880e3cec2f0f21679428",
    "0d72f8e69406dac5a30eb88c7a955e26",
    "1f1be72781b132d18a6f35b6a077ca53",
    "2de0ff368b4ec4304fb411c5ecd36cdb",
    "3112938aeab6d1eb0a0a4b90093ff80c",
    "31687863358bee2bcacc7fd033e1ea8a",
    "3400d9b396a91b8413668bbf8b19a187",
    "6e8e1d2b4a92cf5fbf66a526e76ec5d9",
    "6eaf43027e4018d328f1944f43e6c97f",
