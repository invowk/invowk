[[model]]
name = "LockIntegrity"
tool = "tla"
file = "formal/tla/LockIntegrity.tla"
budget_seconds = 45  # 1.5 x 29.9s CI max (3 dispatch runs)
budget_source = "ci"
calibration = """2026-09-25 (trace validation): TestLockIntegrity_TraceHarness records \
real Sync, LoadDeclaredFromLock plus VendorModules, the discovery check, and \
sibling admission under LegacyLock = TRUE: 218 sequences, 131 unique accepted \
traces, 7 targeted mutations. make formal-traces on 16 cores went from 68 \
traces in 9.1 s to 208 unique traces in 27.3 s (WriteSuite now de-duplicates \
every suite: Serverbase 49 -> 11, AtomicWrite 8 -> 4). The traces required two \
alignments that change no property and keep every command's verdict: a sync \
failing its commit check keeps the cache (without it one real trace is \
rejected), and a v2 vendor whose hash check fails leaves the copied content \
in invowk_modules/ (likewise); the leftover is a calibration note, not a \
finding, because discovery still rejects it. Reading the admission code found \
F12 (open): a hashless caller entry, which LoadCommandScopeLock reaches because \
it skips RequireV2, admits a sibling's copy; findingF12HashlessSiblingAdmission \
reproduces it, f12AdmitRequiresCallerHash passes, and the Go replay confirms it. \
Seeded defects: Sync recording a new baseline on a commit mismatch (4 traces \
rejected; three replays fail) and admission ignoring the caller's hash (the F6 \
mutation equals a recorded trace, so the harness fails) are detected; \
VendorModules skipping its hash check is invisible to traces, because the copy \
lands either way, and TestVendorHashMismatchLeavesCopiedContent detects it. \
2026-09-25: findings F4 and F6 are fixed (hashless entries are rejected for \\
vendored content and never vouch for a cached copy; admission compares the \\
caller's locked hash with the discovered copy); the pre-fix behaviours are \\
regression mutants. 2026-09-24: TLC reproduced finding F5 (tag moved, cache empty, sync rewrites the \\
lock hash to the attacker's content and so also launders a tampered vendored \\
copy), and the fix shipped in verify-locked-module-integrity (#142) passes. \\
F4 and F6 reproduce as counterexamples with passing fix configurations, and \\
Go replay tests confirm both behaviours in the real code."""

[model.constants]
FixedSync = "TRUE"
RejectUnhashed = "TRUE"
CheckCallerHash = "TRUE"
AdmitRequiresCallerHash = "FALSE"
LegacyLock = "FALSE"
Mutant = "\"none\""

