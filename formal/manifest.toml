# SPDX-License-Identifier: MPL-2.0
#
# Formal-verification manifest read by scripts/formal.py.
#
# Every command declares its expected verdict:
#   pass            - Alloy check with no counterexample / TLC run with no error
#   counterexample  - a mutant or a recorded finding; the checker must find one
#   instance        - Alloy run that must be satisfiable (non-vacuity, witness)
# A safety command (expect = "pass" with a property) needs at least one
# command with mutant_of pointing at it, and Alloy checks need an antecedent.

[tools.alloy]
version = "6.2.0"
jar = "org.alloytools.alloy.dist.jar"
url = "https://github.com/AlloyTools/org.alloytools.alloy/releases/download/v6.2.0/org.alloytools.alloy.dist.jar"
# First-download checksum from the official release (GitHub publishes no digest for this asset).
sha256 = "6b8c1cb5bc93bedfc7c61435c4e1ab6e688a242dc702a394628d9a9801edb78d"

[tools.tla]
version = "1.7.4"
jar = "tla2tools.jar"
url = "https://github.com/tlaplus/tlaplus/releases/download/v1.7.4/tla2tools.jar"
# Matches the checksum independently recorded by the Lushtext evaluation for the same release.
sha256 = "936a262061c914694dfd669a543be24573c45d5aa0ff20a8b96b23d01e050e88"

[[model]]
name = "ScopeConstruction"
tool = "alloy"
file = "formal/alloy/ScopeConstruction.als"
calibration = """2026-09-24: the golden vectors (116928 exhaustive instances) and the rapid \
intent test each detect all five seeded code defects: direct dependency ignoring \
SourceID, lock match ignoring command_source_id, every module treated as global, \
same-module check ignoring SourceID, and any requires admitting all modules. \
Excluding Explicit sources from the golden scope hid the first and fourth; the \
golden command therefore keeps them."""

[model.golden]
command = "golden"
output = "internal/app/deps/testdata/formal/scope_construction_golden.json.gz"

[[model.command]]
name = "allowedTargetsBounded"
expect = "pass"
property = "boundedProp"
antecedent = "anteBounded"

[[model.command]]
name = "anteBounded"
expect = "instance"

[[model.command]]
name = "allowedTargetsComplete"
expect = "pass"
property = "completeProp"
antecedent = "anteComplete"

[[model.command]]
name = "anteComplete"
expect = "instance"

[[model.command]]
name = "rootDenied"
expect = "pass"
property = "rootDeniedProp"
antecedent = "anteRoot"

[[model.command]]
name = "anteRoot"
expect = "instance"

[[model.command]]
name = "localBranchDead"
expect = "pass"
property = "localBranchDeadProp"
antecedent = "anteLocal"

[[model.command]]
name = "anteLocal"
expect = "instance"

[[model.command]]
name = "mutantNoSrcUnique"
expect = "counterexample"
property = "boundedProp"
mutant_of = "allowedTargetsBounded"

[[model.command]]
name = "mutantEmptySrc"
expect = "counterexample"
property = "boundedProp"
mutant_of = "allowedTargetsBounded"

[[model.command]]
name = "mutantRootNotReserved"
expect = "counterexample"
property = "rootDeniedProp"
mutant_of = "rootDenied"

[[model.command]]
name = "mutantLocalEmptySrc"
expect = "counterexample"
property = "localBranchDeadProp"
mutant_of = "localBranchDead"

[[model.command]]
name = "mutantCompleteEmptySrc"
expect = "counterexample"
property = "completeProp"
mutant_of = "allowedTargetsComplete"

[[model.command]]
name = "witnessGlobalChild"
expect = "instance"
witness = true

[[model.command]]
name = "witnessDirectDependency"
expect = "instance"
witness = true

[[model.command]]
name = "witnessDeniedModule"
expect = "instance"
witness = true

[[model.command]]
name = "witnessSharedModuleID"
expect = "instance"
witness = true

[[model.command]]
name = "golden"
expect = "instance"

[[model]]
name = "DependencyClosure"
tool = "alloy"
file = "formal/alloy/DependencyClosure.als"
calibration = """2026-09-24: the golden replays (25765 exhaustive instances) and the rapid tidy \
test detect all four seeded code defects: diagnostics without per-key dedup, \
declared roots reported as missing, tidy stopping after one round, and the \
vendored check reading only the first requirement."""

[model.golden]
command = "golden"
output = "pkg/invowkmod/testdata/formal/dependency_closure_golden.json.gz"

[[model.command]]
name = "syncAcceptsOnlyClosedSets"
expect = "pass"
property = "closedIffNoDiag"
antecedent = "anteSync"

[[model.command]]
name = "anteSync"
expect = "instance"

[[model.command]]
name = "diagnosticsWithinClosure"
expect = "pass"
property = "diagWithinClosure"
antecedent = "anteDiag"

[[model.command]]
name = "anteDiag"
expect = "instance"

[[model.command]]
name = "tidyAddsNoDeclaredKey"
expect = "pass"
property = "tidyMinimal"
antecedent = "anteTidy"

[[model.command]]
name = "anteTidy"
expect = "instance"

[[model.command]]
name = "mutantAllModules"
expect = "counterexample"
property = "closedIffNoDiag"
mutant_of = "syncAcceptsOnlyClosedSets"

[[model.command]]
name = "mutantDiagIncludesRoots"
expect = "counterexample"
property = "diagWithinClosure"
mutant_of = "diagnosticsWithinClosure"

[[model.command]]
name = "mutantTidyIncludesRoots"
expect = "counterexample"
property = "tidyMinimal"
mutant_of = "tidyAddsNoDeclaredKey"

[[model.command]]
name = "witnessDeepChain"
expect = "instance"
witness = true

[[model.command]]
name = "witnessCycle"
expect = "instance"
witness = true

[[model.command]]
name = "witnessDiamond"
expect = "instance"
witness = true

[[model.command]]
name = "golden"
expect = "instance"

[[model]]
name = "LockIdentity"
tool = "alloy"
file = "formal/alloy/LockIdentity.als"
calibration = """2026-09-24: the golden replay (28858 exhaustive instances) detects all four \
seeded code defects: identity without the namespace fallback, namespace preferred \
over module_id, and an off-by-one ambiguity threshold in each of \
FindAmbiguousLockedModuleEntries and EvaluateVendoredModuleHash."""

[model.golden]
command = "golden"
output = "pkg/invowkmod/testdata/formal/lock_identity_golden.json.gz"

[[model.command]]
name = "v2NeverUnhashed"
expect = "pass"
property = "noUnhashedIdentity"
antecedent = "anteV2"

[[model.command]]
name = "anteV2"
expect = "instance"

[[model.command]]
name = "mutantV2WithoutParseFact"
expect = "counterexample"
property = "noUnhashedIdentity"
mutant_of = "v2NeverUnhashed"

[[model.command]]
name = "witnessV1Unhashed"
expect = "instance"
witness = true

[[model.command]]
name = "witnessFallbackCollision"
expect = "instance"
witness = true

[[model.command]]
name = "witnessEmptyIdentity"
expect = "instance"
witness = true

[[model.command]]
name = "golden"
expect = "instance"

[[model]]
name = "Serverbase"
tool = "tla"
file = "formal/tla/Serverbase.tla"
calibration = """2026-09-24: TLC reproduces findings F1 and F2 with exactly the interleavings \\
predicted by reading internal/core/serverbase/base.go (F1: Start CAS, Stop CAS, \\
Stop reads nil cancel, Start stores ctx; F2: Fail reads Created under the lock, \\
Stop CASes Created->Stopped lock-free, Fail stores Failed), and both fixed \\
configurations pass. The sequential rapid binding detects three seeded defects \\
(Created stop reporting a win, Running without closing the started channel, \\
Stopped leaving the error channel open)."""

[[model.command]]
name = "errClosedOnce"
config = "Serverbase_ErrClosedOnce.cfg"
expect = "pass"
property = "ErrClosedAtMostOnce"
dead_actions = ["RunCloseLoser"]

[[model.command]]
name = "mutantCloseTwice"
config = "Serverbase_ErrClosedOnce_MutantCloseTwice.cfg"
expect = "counterexample"
property = "ErrClosedAtMostOnce"
mutant_of = "errClosedOnce"

[[model.command]]
name = "noSendAfterClose"
config = "Serverbase_NoSendAfterClose.cfg"
expect = "pass"
property = "NoSendAfterClose"
dead_actions = ["RunCloseLoser"]

[[model.command]]
name = "mutantSendWithoutCheck"
config = "Serverbase_NoSendAfterClose_MutantNoCheck.cfg"
expect = "counterexample"
property = "NoSendAfterClose"
mutant_of = "noSendAfterClose"

[[model.command]]
name = "startedByWinner"
config = "Serverbase_StartedByWinner.cfg"
expect = "pass"
property = "StartedClosedByWinner"
dead_actions = ["RunCloseLoser"]

[[model.command]]
name = "mutantCloseStartedUnconditionally"
config = "Serverbase_StartedByWinner_MutantUnconditional.cfg"
expect = "counterexample"
property = "StartedClosedByWinner"
mutant_of = "startedByWinner"

# Finding F2: the current code violates TerminalAbsorbing; the fix passes.
[[model.command]]
name = "terminalAbsorbingFixed"
config = "Serverbase_TerminalAbsorbing_Fixed.cfg"
expect = "pass"
property = "TerminalAbsorbing"
dead_actions = ["RunCloseLoser"]

[[model.command]]
name = "findingF2TerminalOverwrite"
config = "Serverbase_TerminalAbsorbing_Current.cfg"
expect = "counterexample"
property = "TerminalAbsorbing"
mutant_of = "terminalAbsorbingFixed"

# Finding F1: the current code violates StopCancelsContext; the fix passes.
[[model.command]]
name = "stopCancelsContextFixed"
config = "Serverbase_StopCancels_Fixed.cfg"
expect = "pass"
property = "StopCancelsContext"
dead_actions = ["RunCloseLoser", "StartStore"]

[[model.command]]
name = "findingF1StopDuringStart"
config = "Serverbase_StopCancels_Current.cfg"
expect = "counterexample"
property = "StopCancelsContext"
mutant_of = "stopCancelsContextFixed"

[[model.command]]
name = "witnessConcurrentStop"
config = "Serverbase_WitnessConcurrentStop.cfg"
expect = "counterexample"
property = "WitnessNoConcurrentStop"
witness = true

[[model.command]]
name = "witnessRunning"
config = "Serverbase_WitnessRunning.cfg"
expect = "counterexample"
property = "WitnessNeverRunning"
witness = true

[[model.command]]
name = "witnessStartedClosed"
config = "Serverbase_WitnessStartedClosed.cfg"
expect = "counterexample"
property = "WitnessNeverStartedClosed"
witness = true

[[model]]
name = "LockIntegrity"
tool = "tla"
file = "formal/tla/LockIntegrity.tla"
calibration = """2026-09-24: TLC reproduces finding F5 (tag moved, cache empty, sync rewrites the \\
lock hash to the attacker's content and so also launders a tampered vendored \\
copy), and the fix shipped in verify-locked-module-integrity (#142) passes. \\
F4 and F6 reproduce as counterexamples with passing fix configurations, and \\
Go replay tests confirm both behaviours in the real code."""

[[model.command]]
name = "f5FixedSync"
config = "LockIntegrity_F5_Fixed.cfg"
expect = "pass"
property = "OwnLoadTrusted"

[[model.command]]
name = "findingF5FreshCacheSync"
config = "LockIntegrity_F5_Current.cfg"
expect = "counterexample"
property = "OwnLoadTrusted"
mutant_of = "f5FixedSync"

[[model.command]]
name = "f4RejectUnhashed"
config = "LockIntegrity_F4_Fixed.cfg"
expect = "pass"
property = "OwnLoadTrusted"

[[model.command]]
name = "findingF4HashlessLock"
config = "LockIntegrity_F4_Current.cfg"
expect = "counterexample"
property = "OwnLoadTrusted"
mutant_of = "f4RejectUnhashed"

[[model.command]]
name = "f6CheckCallerHash"
config = "LockIntegrity_F6_Fixed.cfg"
expect = "pass"
property = "SiblingCallTrusted"

[[model.command]]
name = "findingF6CrossLockAdmission"
config = "LockIntegrity_F6_Current.cfg"
expect = "counterexample"
property = "SiblingCallTrusted"
mutant_of = "f6CheckCallerHash"

[[model.command]]
name = "witnessMovedTag"
config = "LockIntegrity_WitnessMovedTag.cfg"
expect = "counterexample"
property = "WitnessNoMovedTag"
witness = true

[[model.command]]
name = "witnessLoadedGood"
config = "LockIntegrity_WitnessLoadedGood.cfg"
expect = "counterexample"
property = "WitnessNeverLoadedGood"
witness = true

[[model.command]]
name = "witnessCalledGood"
config = "LockIntegrity_WitnessCalledGood.cfg"
expect = "counterexample"
property = "WitnessNeverCalledGood"
witness = true

[[model]]
name = "AtomicWrite"
tool = "tla"
file = "formal/tla/AtomicWrite.tla"
calibration = """2026-09-24: under the named POSIX axioms TLC shows finding F3 (no fsync: power \\
loss can leave an empty lock file even though readers never see partial \\
content), that fsync(file) alone restores D-Atomic, and that fsync(file) plus \\
fsync(dir) are needed for D-Commit. The real-filesystem binding detects two \\
seeded defects (no temp cleanup, rename before write)."""

[[model.command]]
name = "readersNeverSeePartial"
config = "AtomicWrite_Readers.cfg"
expect = "pass"
property = "ReadersNeverSeePartial"

[[model.command]]
name = "mutantWriteInPlace"
config = "AtomicWrite_Readers_MutantInPlace.cfg"
expect = "counterexample"
property = "ReadersNeverSeePartial"
mutant_of = "readersNeverSeePartial"

[[model.command]]
name = "tempRemovedOnError"
config = "AtomicWrite_TempRemoved.cfg"
expect = "pass"
property = "TempRemovedOnError"

[[model.command]]
name = "mutantSkipCleanup"
config = "AtomicWrite_TempRemoved_MutantSkipCleanup.cfg"
expect = "counterexample"
property = "TempRemovedOnError"
mutant_of = "tempRemovedOnError"

# Finding F3: D-Atomic needs fsync(file); D-Commit needs fsync(file) and fsync(dir).
[[model.command]]
name = "durableAtomicWithFileSync"
config = "AtomicWrite_DAtomic_SyncFile.cfg"
expect = "pass"
property = "DurableAtomic"

[[model.command]]
name = "findingF3DurableAtomicCurrent"
config = "AtomicWrite_DAtomic_Current.cfg"
expect = "counterexample"
property = "DurableAtomic"
mutant_of = "durableAtomicWithFileSync"

[[model.command]]
name = "durableAtomicDirSyncOnly"
config = "AtomicWrite_DAtomic_SyncDirOnly.cfg"
expect = "counterexample"
property = "DurableAtomic"
mutant_of = "durableAtomicWithFileSync"

[[model.command]]
name = "durableCommitWithFullSync"
config = "AtomicWrite_DCommit_FullSync.cfg"
expect = "pass"
property = "DurableCommit"

[[model.command]]
name = "findingF3DurableCommitCurrent"
config = "AtomicWrite_DCommit_Current.cfg"
expect = "counterexample"
property = "DurableCommit"
mutant_of = "durableCommitWithFullSync"

[[model.command]]
name = "durableCommitFileSyncOnly"
config = "AtomicWrite_DCommit_SyncFileOnly.cfg"
expect = "counterexample"
property = "DurableCommit"
mutant_of = "durableCommitWithFullSync"

[[model.command]]
name = "witnessCrashAfterReturn"
config = "AtomicWrite_WitnessCrashAfterReturn.cfg"
expect = "counterexample"
property = "WitnessNoCrashAfterReturn"
witness = true

[[model.command]]
name = "witnessFailure"
config = "AtomicWrite_WitnessFailure.cfg"
expect = "counterexample"
property = "WitnessNoFailure"
witness = true
