name = "scriptReadDiscoveryGuarded"
body = "scriptReadGuarded[True, True]"
expect = "pass"
property = "scriptReadGuarded"
antecedent = "anteScriptGuarded"

[[model.command]]
name = "anteScriptGuarded"
body = "anteScriptGuarded"
expect = "instance"

[[model.command]]
name = "mutantDropLinkedRootReject"
body = "scriptReadGuarded[False, True]"
expect = "counterexample"
property = "scriptReadGuarded"
mutant_of = "scriptReadDiscoveryGuarded"

[[model.command]]
name = "mutantDropLoadScan"
body = "scriptReadGuarded[True, False]"
expect = "counterexample"
property = "scriptReadGuarded"
mutant_of = "scriptReadDiscoveryGuarded"

# Junction-aware scan, and the physical read check that fixed F16: Load's scan
# on Windows records symlinks only, so an inner junction is admitted, and only
# the os.Root read check keeps the read inside (module-read-physical-containment).
[[model.command]]
name = "scriptReadScanAllKinds"
body = "scriptReadScanGuarded[LinkKind, False]"
expect = "pass"
property = "scriptReadScanGuarded"
antecedent = "anteScriptGuarded"

[[model.command]]
name = "mutantScanNoKinds"
body = "scriptReadScanGuarded[none, False]"
expect = "counterexample"
property = "scriptReadScanGuarded"
mutant_of = "scriptReadScanAllKinds"

# scriptReadScanPhysical is a definitional fix configuration: with phys on, the
# guard includes physContains, which already implies contained whatever the
# scan records, so the command restates the F16 fix rather than checking it.
# The code-side assurance (os.Root denies the read through an inner junction)
# comes from TestModulePathContainment_F16Junction on windows-latest and the
# golden replay's absolute pass. The same holds for the PhysMode commands.
[[model.command]]
name = "scriptReadScanPhysical"
body = "scriptReadScanGuarded[SymKind, True]"
expect = "pass"
property = "scriptReadScanGuarded"
antecedent = "anteScriptGuarded"

[[model.command]]
name = "mutantPreFixF16JunctionScriptRead"
body = "scriptReadScanGuarded[SymKind, False]"
expect = "counterexample"
property = "scriptReadScanGuarded"
mutant_of = "scriptReadScanPhysical"

# Script read containment (physical fix), with the fixed F13 as its pre-fix
# regression mutant (module-read-physical-containment).
[[model.command]]
name = "scriptReadContainedPhysical"
body = "readContainedKind[ScriptRead, PhysMode]"
expect = "pass"
property = "readContainedKind"
antecedent = "anteReadContained"

[[model.command]]
name = "anteReadContained"
body = "anteReadContained"
expect = "instance"

[[model.command]]
name = "mutantScriptNoContainment"
body = "readContainedKind[ScriptRead, NoneMode]"
expect = "counterexample"
property = "readContainedKind"
mutant_of = "scriptReadContainedPhysical"

[[model.command]]
name = "mutantPreFixF13LexicalScriptContainment"
body = "readContainedKind[ScriptRead, LexMode]"
expect = "counterexample"
property = "readContainedKind"
mutant_of = "scriptReadContainedPhysical"

# Env-file read containment (physical fix), with the fixed F17 as its pre-fix
# regression mutant (module-read-physical-containment).
[[model.command]]
name = "envReadContainedPhysical"
body = "readContainedKind[EnvRead, PhysMode]"
expect = "pass"
property = "readContainedKind"
antecedent = "anteEnvContained"

[[model.command]]
name = "anteEnvContained"
body = "anteEnvContained"
expect = "instance"

[[model.command]]
name = "mutantEnvNoContainment"
body = "readContainedKind[EnvRead, NoneMode]"
expect = "counterexample"
property = "readContainedKind"
mutant_of = "envReadContainedPhysical"

[[model.command]]
name = "mutantPreFixF17EnvNoPhysicalContainment"
body = "readContainedKind[EnvRead, LexMode]"
expect = "counterexample"
property = "readContainedKind"
mutant_of = "envReadContainedPhysical"

# Copy and hash never follow inner links.
[[model.command]]
name = "copyHashStaysInside"
body = "copyHashInside[False]"
expect = "pass"
property = "copyHashInside"
antecedent = "anteCopyHash"

[[model.command]]
name = "anteCopyHash"
body = "anteCopyHash"
expect = "instance"

[[model.command]]
name = "mutantCopyFollowsLinks"
body = "copyHashInside[True]"
expect = "counterexample"
property = "copyHashInside"
mutant_of = "copyHashStaysInside"

# Copy and hash of a module today's Windows scan admits, inner junctions
# included (F16): base admission excludes those modules, so copyHashStaysInside
# never examines them (decision 29).
[[model.command]]
name = "copyHashJunctionScan"
body = "copyHashScanInside[False, SymKind]"
expect = "pass"
property = "copyHashScanInside"
antecedent = "anteCopyHashJunction"

[[model.command]]
name = "anteCopyHashJunction"
body = "anteCopyHashJunction"
expect = "instance"

[[model.command]]
name = "mutantCopyFollowsJunction"
body = "copyHashScanInside[True, SymKind]"
expect = "counterexample"
property = "copyHashScanInside"
mutant_of = "copyHashJunctionScan"

# Unpack writes stay inside the destination.
