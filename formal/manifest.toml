budget_source = "local"
scope = "6 but exactly 3 Req"  # default for every command below
calibration = """2026-09-25: the golden replays (14580 instances then) and the rapid property \
detect the seeded defects, and the unevaluated-vs-evaluated comparison is \
exercised by every escaping-ancestor instance. mutantNoParentEval is the model \
form of "return the unresolved path when any component is missing" (the walk \
used only when nothing is missing), a superset of the F14 defect. The replay \
builds the resolver directly over materialised roots so t.TempDir's enclosing \
roots do not make the check vacuous (design D5.4), and it fails if no instance \
places a node outside every root. Finding F15 (workdir widening the allowed \
roots under restricted access) reproduced with a passing fixed configuration \
until module-workdir-roots fixed it (below); F14 (deep missing path through an \
escaping symlink) reproduced until virtual-path-physical-normalisation fixed \
it (below). \
2026-11-14 (harden-formal-instruments): the reach gate found allowedRoots \
(newVirtualPathResolverForFilesystem), anchors (standardVirtualAnchorsForOS) and \
access (EffectiveAccess) never executed by the golden. allowedRoots and access \
bind TestVirtualPathHarness_RootConstruction, which builds the real resolver \
for access omitted, restricted and full, with and without a declared path, \
and requires acceptance per location kind to equal H.access = Full or \
locIsAllowedRoot[l, True] (then F15; since module-workdir-roots the fixed rule \
TrustedOrInside, below) and the omitted mode to be restricted \
(virtual-filesystem-access spec). anchors binds it too with the narrow claim \
of decision 14: @config, @data, @cache, @state, @tmp and @work as the resolver \
reports them are accepted, and @home/.ssh/<tag> is denied under restricted \
access (cross-platform-path-anchors "Anchor allow roots are explicit"); the \
anchor paths are inputs from the production resolver, not verified. Seeded one \
at a time and reverted: dropping the declared paths from the roots fails it \
(declared-path probes denied); EffectiveAccess returning full for an omitted \
mode fails it (EffectiveAccess and outside probes); adding @home to the allowed \
roots in newVirtualPathResolverForFilesystem fails it (4 disagreements: the \
@home probe accepted under omitted and restricted access, with and without a \
declared path); setting the @config anchor to the home directory itself in \
standardVirtualAnchorsForOS fails it (the same 4 disagreements). \
2026-11-24 (virtual-path-physical-normalisation, F18): a request records the \
kind of link it crosses (none, Symlink, Junction), the golden scope is two \
requests (1512 instances; a request reads only itself and H, so two requests \
still show each of its 63 combinations), and the golden replay materialises \
junction requests on Windows (1404 of 3024 requests, left out and counted \
elsewhere). These three figures are those of the intermediate F18 commit, \
superseded by the F19 paragraph's below (2592 instances, 81 request shapes, \
1836 of 5184 requests). walkVirtualPath (row normalized) is bound to the golden replay and \
to TestVirtualPathHarness_WalkOverFakeFilesystem, which drives it over a fake \
filesystem that fails the test when the walk looks below a link. Seeded and \
reverted (go test -overlay): "the walk does not follow a junction-like entry" \
(isVirtualPathLink returning true only for ModeSymlink) fails \
TestVirtualPathHarness_WalkOverFakeFilesystem on Linux in nine cases, among \
them "existing file through a junction", "new file through a junction", \
"deep new file through a junction" and "junction as the last component"; the \
golden replay cannot see it off Windows, where no junction exists. \
Same change, F14 and F19: normalizeExistingOrParent returns the deepest \
existing ancestor joined with the missing components, with no fallback. A \
request also records whether its link dangles; the golden has 2592 instances \
of two requests (81 request shapes, which the replay requires without -short; \
1836 of 5184 requests cross a junction) and is compared with the fixed \
decision dAccepts; the replay takes about 0.1 s on Linux. The rapid property \
has no finding exemption and compares both ways with an oracle built from the \
tree (inside, outside, unresolvable). Seeded one at a time and reverted (go \
test -overlay), with the bindings that fail: (1) "return the unresolved path \
at two or more missing components" fails the golden replay, \
TestVirtualPathHarness_DeepMissingPathThroughSymlinkDenied, \
TestVirtualPathHarness_DanglingLinkEscapeDenied and the rapid property; (2) \
"treat a link with a missing target as a missing name" (return the link's own \
path) fails the golden replay, TestVirtualPathHarness_DanglingLinkEscapeDenied \
and the rapid property; (3) "treat an lstat error other than not-exist as \
missing" fails TestVirtualPathHarness_WalkOverFakeFilesystem; (4) "join a .. \
that follows a missing component instead of refusing it" fails \
TestVirtualPathHarness_WalkOverFakeFilesystem, \
TestVirtualPathHarness_DanglingLinkEscapeDenied (its two-link leg) and the \
rapid property; (5) the junction seed above. Two more, in \
normalizeExistingOrParent itself: dropping the walk's error and dropping the \
empty-path error each fail the golden replay's resolution-error checks. \
2026-11-24 (virtual-path-no-follow-operands, design D7): the no-follow form \
is a recorded abstraction, not a request kind: rows normalized \
(virtualPathResolver.resolveNoFollow) and accepts \
(virtualPathValidator.validateNoFollow; the existing validate element is on \
the shrink-only unresolved list, so the new row names the model's \
acceptance predicate) bind \
TestVirtualPathHarness_NoFollowOperands, which builds trees with fstree and \
compares the no-follow path and verdict under both access modes (a live, a \
dangling and a cyclic link, a link to an outside file, a parent through an \
escaping link, a missing name, the root itself, a link to the root, and on \
Windows a junction subtest). The model and the golden vectors are unchanged; \
the golden file was regenerated only because its fingerprint hashes the \
whole .als, comments included, and the table changed. Seeded one at a time \
and reverted (go test -overlay): "resolveNoFollow resolves the final name \
too" fails TestVirtualPathHarness_NoFollowOperands (8 disagreements, among \
them the live, dangling and cyclic links and the link to the root); \
"resolveNoFollow resolves the parent lexically" fails it on the \
escaping-parent case under both access modes. The walk's helpers are bound \
for the first time (rows normalized, follow-up a), and each is calibrated by \
a seed that sits in it, with the bindings that fail it: \
virtualPathWalker.walk holds seed (3) above (WalkOverFakeFilesystem); \
missingVirtualPathSuffix holds seed (4) (WalkOverFakeFilesystem, \
DanglingLinkEscapeDenied, the rapid property); isVirtualPathLink holds the \
junction seed (5) (WalkOverFakeFilesystem). New seeds, one per helper that \
held none: virtualPathWalker.next "keep inLink when an own component is \
taken" fails WalkOverFakeFilesystem; virtualPathWalker.enterVolume "keep the \
current prefix once one is set" fails the golden replay, \
WalkOverFakeFilesystem and NoFollowOperands; virtualPathWalker.follow "queue \
a rooted target below the current prefix" fails the golden replay, \
WalkOverFakeFilesystem and NoFollowOperands; virtualPathWalker.unresolvedLink \
"drop the link's own name" fails WalkOverFakeFilesystem; virtualPathWalk.path \
"drop the missing components" fails the golden replay; \
normalizeVirtualPathForAccess "full access returns the cleaned path even \
when the walk resolves" fails NoFollowOperands. The binding reach gate \
reaches every new (row, killer, function) triple on Linux and skips none. \
Same change, fix-stage review (PR #198): the full-access fallback forms of \
normalizeVirtualPathForAccess bind TestVirtualPathFullAccessFallback, and the \
not-a-directory branch of resolveNoFollow and validateNoFollow binds \
TestVirtualPathNoFollowValidatorDirectoryCheck; validateNoFollow's \
allowed-root check is written out in it, so its row covers it. Seeded one at \
a time and reverted (go test -overlay), with the bindings that fail: \
"full access ignores the outermost link's own path" and "full access \
returns the walk's error instead of the cleaned path" fail \
TestVirtualPathFullAccessFallback only; "resolveNoFollow ignores a request \
that names a directory" and "validateNoFollow skips the not-a-directory \
check" fail TestVirtualPathNoFollowValidatorDirectoryCheck only; \
"validateNoFollow skips the allowed-root check" fails NoFollowOperands; \
"validateNoFollow negates pathWithin" fails NoFollowOperands and \
TestVirtualPathNoFollowValidatorDirectoryCheck. \
2026-11-25 (module-workdir-roots, F15 fixed): H holds a workdir kind \
(TrustedWorkdir, ModuleInside, ModuleOutside; a module-inside workdir leaves \
no InWorkdir location) in place of includeWorkdir, and the code's root rule \
is a parameter (AlwaysRoot pre-fix, TrustedOrInside fixed, NeverRoot strict). \
The finding command became mutantPreFixF15WorkdirRoot, and \
trustedWorkdirReadableFixed with mutantStrictWorkdirNeverRoot keeps the fix \
from becoming the strict variant. The golden leaves the workdir kind free \
and allows at most one InWorkdir location (a module-inside instance has \
none): 8790 instances (3794 TrustedWorkdir, 3794 ModuleOutside, 1202 \
ModuleInside; the 81 request shapes are unchanged), 6424 bytes, and the \
replay takes about 0.4 s on Linux. The golden replay builds a virtualWorkdir \
per instance kind and adds the workdir to the roots exactly when \
virtualWorkdir.isReadRoot says so. TestVirtualPathHarness_F15WorkdirWidening \
is inverted and renamed TestVirtualPathHarness_ModuleWorkdirOutsideNotRoot; \
TestVirtualPathHarness_RootConstruction builds the workdir through \
virtualWorkdirFor for 13 kinds (CLI override; plain invowkfile root, command \
and implementation; module default and inside; module-outside by "..", by an \
absolute path and through a link; the CLI override over a module-outside \
declaration at each level). Seeded one at a time and reverted (go test \
-overlay), with the bindings that fail: (1) "always add the workdir and \
@work" in newVirtualPathResolverForFilesystem (the pre-fix rule) fails \
ModuleWorkdirOutsideNotRoot, RootConstruction and TestVirtualWorkdir; (2) \
"never add the workdir" there fails ModuleWorkdirOutsideNotRoot, \
RootConstruction and TestVirtualWorkdir; (3) isReadRoot "always true" fails \
the golden replay, ModuleWorkdirOutsideNotRoot, the rapid property, \
RootConstruction and TestVirtualWorkdir; (4) isReadRoot "false for every \
module-declared workdir" fails the golden replay, the rapid property and \
TestVirtualWorkdir, and not RootConstruction, whose module-inside kind has \
no workdir-only probe (the masked case of the workdirIsRoot row); (5) \
effectiveWorkDirSource without the CLI-override test fails \
TestResolveEffectiveWorkDir, ModuleWorkdirOutsideNotRoot, RootConstruction \
and TestVirtualWorkdir; (6) it without the implementation test fails \
TestResolveEffectiveWorkDir, ModuleWorkdirOutsideNotRoot, the rapid \
property, RootConstruction and TestVirtualWorkdir; (7) it with the \
implementation and command tests swapped fails TestResolveEffectiveWorkDir \
only; (8) DeclaredByInvowkfile false for the command level fails the rapid \
property, RootConstruction, TestVirtualWorkdir and \
TestInteractiveSpecCarriesWorkDirModuleRoot; (9) virtualWorkdirFor never \
recording the module root fails ModuleWorkdirOutsideNotRoot, the rapid \
property, RootConstruction, TestVirtualWorkdir and \
TestInteractiveSpecCarriesWorkDirModuleRoot. The binding reach gate reaches \
every new (row, killer, function) triple on Linux and skips none."""

