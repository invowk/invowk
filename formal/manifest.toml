[[model]]
name = "ConcurrentModuleEdits"
tool = "tla"
file = "formal/tla/ConcurrentModuleEdits.tla"
calibration = """2026-09-25: TLC reproduces F8 on today's code in all four scenarios \
(sync_add, update_add, update_remove, add_add_same), F9 (fetch_v1_v2), and F10 \
(rollback_read); no hypothesised id was refuted. vendor_sync also fails: vendor \
returns ok from a lock replaced before its copy finished, so it is recorded as \
proposed finding proposedVendorFromStaleLock without an id and escalated (discovery \
later rejects the stale copy, so it fails closed). The project mutex fixes F8 and \
the vendor case, the project-and-source mutexes fix F9 and never deadlock, and an \
atomic restore fixes F10; each fix has a non-finding mutant. Go replays confirm \
F8 (four TestConcurrentEdits_FindingF8_* tests), F9, and the vendor case; F10 is \
model-only. The replays detect five seeded remedies, one at a time: update \
re-reading the lock before saving, sync keeping the current lock's entries, one \
worktree per version, a duplicate add skipping the rollback, and vendor rejecting \
a lock changed while it copied. Total: 31 commands, 2585 distinct states; `scripts/formal.py \
tla ConcurrentModuleEdits` takes 18 s wall time on 16 cores (218 s CPU, dominated \
by JVM start-up), the input to promote-formal-ci-gate's budget_seconds."""

[model.constants]
Procs = "{p1, p2}"
Projects = "{pA}"
Scenario = "\"sync_add\""
AdvisoryLock = "\"none\""
AtomicRestore = "FALSE"
Mutant = "\"none\""

# F8 (open): sync rebuilds the lock from requires read before its fetch.
[[model.command]]
name = "syncAddProjectLock"
constants = { AdvisoryLock = "\"project\"" }
expect = "pass"
property = "LockMatchesRequires"
dead_actions = ["Checkout", "CopyToCache", "RestoreRemove", "RestoreTruncate", "RestoreWrite", "VendorRemove", "VendorCopy"]
distinct_states = 49

[[model.command]]
name = "findingF8SyncOverwritesConcurrentAdd"
finding = "F8"
expect = "counterexample"
property = "LockMatchesRequires"
mutant_of = "syncAddProjectLock"
distinct_states = 80

[[model.command]]
name = "mutantReleaseBetweenFiles"
constants = { AdvisoryLock = "\"project\"", Mutant = "\"release_between_files\"" }
expect = "counterexample"
property = "LockMatchesRequires"
mutant_of = "syncAddProjectLock"
distinct_states = 74

# F8 (open): update saves the lock it read before its fetch.
