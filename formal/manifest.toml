[[model]]
name = "ConcurrentModuleEdits"
tool = "tla"
file = "formal/tla/ConcurrentModuleEdits.tla"
budget_seconds = 621  # 1.5 x 414.0s CI max (3 dispatch runs)
budget_source = "ci"
calibration = """2026-09-25: TLC reproduces F8 on today's code in all four scenarios \
(sync_add, update_add, update_remove, add_add_same), F9 (fetch_v1_v2), and F10 \
(rollback_read); no hypothesised id was refuted. vendor_sync also fails: vendor \
returns ok from a lock replaced before its copy finished, so it is recorded as \
proposed finding proposedVendorFromStaleLock without an id and escalated (discovery \
later rejects the stale copy, so it fails closed). The project mutex fixes F8 and \
the vendor case, the project-and-source mutexes fix F9 and never deadlock, and an \
atomic restore fixes F10; each fix has a non-finding mutant. Go replays confirm \
F8 (four TestConcurrentEdits_FindingF8_* tests), F9, and the vendor case; F10 is \
model-only. The replays detect five seeded remedies, one at a time: update \
re-reading the lock before saving, sync keeping the current lock's entries, one \
worktree per version, a duplicate add skipping the rollback, and vendor rejecting \
a lock changed while it copied. Total: 31 commands, 2585 distinct states; `scripts/formal.py \
tla ConcurrentModuleEdits` takes 18 s wall time on 16 cores (218 s CPU, dominated \
by JVM start-up), the input to promote-formal-ci-gate's budget_seconds.
2026-11-25 (module-concurrency-rollback, C0): Program(p) dispatches to named \
operators AddProg, RemoveProg, SyncProg, UpdateProg, TidyProg and VendorProg; \
every command kept its verdict and distinct_states.
2026-11-25 (module-concurrency-rollback, F10): the base is AtomicRestore = TRUE, \
as the code now restores by atomic replace; findingF10NonAtomicRollback became \
mutantPreFixF10NonAtomicRollback (AtomicRestore = FALSE) and witnessPartialFile \
keeps the pre-fix restore it witnesses. rollback_read's second process is the \
read-only ReadProg, which takes no mutex in any configuration (TidyProg is \
deleted; tidy is a module command that takes the project lock). Re-measured: \
the add_add_same commands lose the truncating restore's states \
(addAddSameProjectLock 71 -> 63, RestoreTruncate dead; \
findingF8DuplicateAddRollsBackOtherAdd 342 -> 294; \
mutantAddAddLockAfterSnapshot 192 -> 168; witnessRollback 318 -> 270); every \
other command is unchanged. Go: TestConcurrentEdits_F10RestoreReplacesFile \
checks that the restore replaces the lock file (os.SameFile false).
2026-11-25 (module-concurrency-rollback, F8): the base is AdvisoryLock = \
"project", as every module edit (add, remove, sync, update, tidy, vendor) \
now holds the project lock from its first read to its last write. The four \
findingF8* commands became mutantPreFixF8SyncOverwritesConcurrentAdd, \
mutantPreFixF8UpdateOverwritesConcurrentAdd, \
mutantPreFixF8UpdateResurrectsConcurrentRemove and \
mutantPreFixF8DuplicateAddRollsBackOtherAdd, and proposedVendorFromStaleLock \
became mutantPreFixVendorFromStaleLock (mutant_of vendorSyncProjectLock), all \
with AdvisoryLock = "none"; the passing F8 and vendor commands and their \
non-finding mutants dropped their AdvisoryLock = "project" override, which \
equals the base. witnessVendorOverlap stopped being violated under the lock \
and gets AdvisoryLock = "none"; witnessFetchOverlap stays violated under the \
base (a fetch after the other process returned ok). Re-measured: the \
rollback_read commands gain the add's lock steps (rollbackReadAtomicRestore \
52 -> 62, Acquire and Release now live; mutantPreFixF10NonAtomicRollback and \
mutantRestoreRemoveThenWrite 31 -> 35; witnessPartialFile 24 -> 28; \
witnessAtomicRestoreAllOk 51 -> 61); witnessRollback 270 -> 59 and \
witnessFetchOverlap 29 -> 24 now run under the lock; the still-open \
findingF9SharedWorktreeRecordsWrongContent runs under the project lock of \
today's code (47 -> 67, the same space as mutantNoSourceLock); every other \
command is unchanged. Go: the replays are inverted and renamed \
TestConcurrentEdits_F8SyncKeepsConcurrentAdd, \
TestConcurrentEdits_F8UpdateKeepsConcurrentAdd, \
TestConcurrentEdits_F8UpdateKeepsConcurrentRemove and \
TestConcurrentEdits_F8DuplicateAddKeepsOtherAdd, and \
TestConcurrentEdits_VendorFromStaleLock is inverted: each process runs a real \
modulelock.FileLocker on one cache root, and the second process must report \
the busy project lock before it writes anything.
2026-11-25 (module-concurrency-rollback, F9): the base is AdvisoryLock = \
"project_and_source", as a fetch now holds the source lock of its Git \
checkout from right before the fetch until resolveOne returns. \
findingF9SharedWorktreeRecordsWrongContent became \
mutantPreFixF9SharedWorktreeRecordsWrongContent (AdvisoryLock = "none", \
mutant_of fetchProjectAndSourceLock); mutantNoSourceLock and \
witnessProjectLockAllOk keep AdvisoryLock = "project", now the \
project-only configuration; fetchProjectAndSourceLock, noCircularWait, \
mutantReverseOrder, witnessSourceLockAllOk and witnessLockOrderAllOk dropped \
their AdvisoryLock = "project_and_source" override, which equals the base. \
Re-measured: the pre-fix F9 command is back at its unlocked space (67 -> 47); \
every other command is unchanged (the F8 and vendor scenarios fetch no Git \
source, so the source lock adds no step there). Go: the replay is inverted \
and renamed TestConcurrentEdits_F9SourceLockRecordsMatchingContent; its \
fixture keeps the module in a subdirectory so the content hash leaves out \
the checkout's .git and one version hashes the same in every cache."""

[model.constants]
Procs = "{p1, p2}"
Projects = "{pA}"
Scenario = "\"sync_add\""
AdvisoryLock = "\"project_and_source\""
AtomicRestore = "TRUE"
Mutant = "\"none\""

# F8 (fixed): sync rebuilt the lock from requires read before its fetch; it now
# holds the project lock, and the pre-fix code is kept as
# mutantPreFixF8SyncOverwritesConcurrentAdd.
[[model.command]]
name = "syncAddProjectLock"
expect = "pass"
property = "LockMatchesRequires"
dead_actions = ["Checkout", "CopyToCache", "RestoreRemove", "RestoreTruncate", "RestoreWrite", "VendorRemove", "VendorCopy"]
distinct_states = 49

[[model.command]]
name = "mutantPreFixF8SyncOverwritesConcurrentAdd"
constants = { AdvisoryLock = "\"none\"" }
expect = "counterexample"
property = "LockMatchesRequires"
mutant_of = "syncAddProjectLock"
distinct_states = 80

[[model.command]]
name = "mutantReleaseBetweenFiles"
constants = { Mutant = "\"release_between_files\"" }
expect = "counterexample"
property = "LockMatchesRequires"
mutant_of = "syncAddProjectLock"
distinct_states = 74

