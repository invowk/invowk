# SPDX-License-Identifier: MPL-2.0
#
# Formal-verification manifest read by scripts/formal.py.
#
# Every command declares its expected verdict:
#   pass            - Alloy check with no counterexample / TLC run with no error
#   counterexample  - a mutant or a recorded finding; the checker must find one
#   instance        - Alloy run that must be satisfiable (non-vacuity, witness)
# A safety command (expect = "pass" with a property) needs at least one
# command with mutant_of pointing at it, and Alloy checks need an antecedent.
#
# Alloy commands are declared only here: `body` is the formula and `scope`
# overrides the model's default `scope`. The runner renders each one as
# `name: run|check { body } for scope expect 0|1` (instance -> run, pass -> 0)
# into artifacts/formal/<Model>/<Model>.als. TLC configurations are rendered
# from [model.constants] and each command's `constants`, `spec`, and
# `temporal`. Unknown keys, and keys for the other tool, are rejected.

[tools.alloy]
version = "6.2.0"
jar = "org.alloytools.alloy.dist.jar"
url = "https://github.com/AlloyTools/org.alloytools.alloy/releases/download/v6.2.0/org.alloytools.alloy.dist.jar"
# First-download checksum from the official release (GitHub publishes no digest for this asset).
sha256 = "6b8c1cb5bc93bedfc7c61435c4e1ab6e688a242dc702a394628d9a9801edb78d"

[tools.tla]
version = "1.7.4"
jar = "tla2tools.jar"
url = "https://github.com/tlaplus/tlaplus/releases/download/v1.7.4/tla2tools.jar"
# Matches the checksum independently recorded by the Lushtext evaluation for the same release.
sha256 = "936a262061c914694dfd669a543be24573c45d5aa0ff20a8b96b23d01e050e88"

[[model]]
name = "ScopeConstruction"
tool = "alloy"
file = "formal/alloy/ScopeConstruction.als"
scope = "4 but 3 Key, 3 Entry"  # default for every command below
calibration = """2026-09-24: the golden vectors (116928 exhaustive instances) and the rapid \
intent test each detect all five seeded code defects: direct dependency ignoring \
SourceID, lock match ignoring command_source_id, every module treated as global, \
same-module check ignoring SourceID, and any requires admitting all modules. \
Excluding Explicit sources from the golden scope hid the first and fourth; the \
golden command therefore keeps them."""

[model.golden]
command = "golden"
output = "internal/app/deps/testdata/formal/scope_construction_golden.json.gz"

[[model.command]]
name = "allowedTargetsBounded"
body = "discoveryFacts implies boundedProp"
expect = "pass"
property = "boundedProp"
antecedent = "anteBounded"

[[model.command]]
name = "anteBounded"
body = "discoveryFacts and some t: Cmd | allowedImpl[t] and t != Caller.self"
expect = "instance"

[[model.command]]
name = "allowedTargetsComplete"
body = "discoveryFacts implies completeProp"
expect = "pass"
property = "completeProp"
antecedent = "anteComplete"

[[model.command]]
name = "anteComplete"
body = "discoveryFacts and some t: Cmd | intendedAllowed[t] and t != Caller.self"
expect = "instance"

[[model.command]]
name = "rootDenied"
body = "discoveryFacts implies rootDeniedProp"
expect = "pass"
property = "rootDeniedProp"
antecedent = "anteRoot"

[[model.command]]
name = "anteRoot"
body = "discoveryFacts and some t: Cmd | t.src = RootSrc"
expect = "instance"

[[model.command]]
name = "localBranchDead"
body = "discoveryFacts implies localBranchDeadProp"
expect = "pass"
property = "localBranchDeadProp"
antecedent = "anteLocal"

[[model.command]]
name = "anteLocal"
body = "discoveryFacts"
expect = "instance"

# Rejecting mutants: each drops one discovery guarantee and must break the property.
[[model.command]]
name = "mutantNoSrcUnique"
body = "discoveryFactsNoSrcUnique implies boundedProp"
expect = "counterexample"
property = "boundedProp"
mutant_of = "allowedTargetsBounded"

[[model.command]]
name = "mutantEmptySrc"
body = "discoveryFactsEmptySrc implies boundedProp"
expect = "counterexample"
property = "boundedProp"
mutant_of = "allowedTargetsBounded"

[[model.command]]
name = "mutantRootNotReserved"
body = "discoveryFactsRootNotReserved implies rootDeniedProp"
expect = "counterexample"
property = "rootDeniedProp"
mutant_of = "rootDenied"

[[model.command]]
name = "mutantLocalEmptySrc"
body = "discoveryFactsEmptySrc implies localBranchDeadProp"
expect = "counterexample"
property = "localBranchDeadProp"
mutant_of = "localBranchDead"

[[model.command]]
name = "mutantCompleteEmptySrc"
body = "discoveryFactsEmptySrc implies completeProp"
expect = "counterexample"
property = "completeProp"
mutant_of = "allowedTargetsComplete"

# Witnesses: situations the model claims to cover must be reachable.
[[model.command]]
name = "witnessGlobalChild"
body = """
discoveryFacts
some t: Cmd | some t.childOf and allowedImpl[t] and not ownModule[t] and not declaredLocked[t.mod, t.src]"""
expect = "instance"
witness = true

[[model.command]]
name = "witnessDirectDependency"
body = """
discoveryFacts
some t: Cmd | t not in GlobalCmd and not ownModule[t] and allowedImpl[t]"""
expect = "instance"
witness = true

[[model.command]]
name = "witnessDeniedModule"
body = """
discoveryFacts
some t: Cmd | some t.mod and not allowedImpl[t]"""
expect = "instance"
witness = true

[[model.command]]
name = "witnessSharedModuleID"
body = """
discoveryFacts
some disj a, b: Cmd | some a.mod and a.mod = b.mod and allowedImpl[a] and not allowedImpl[b]"""
expect = "instance"
witness = true

# Golden vectors: every instance at a small scope, with the implementation's
# decision recorded in Caller.allowedSet, replayed against the real Go code.
# noJunk (in the model) excludes atoms that cannot influence a decision.
[[model.command]]
name = "golden"
body = """
discoveryFacts
Caller.allowedSet = { t: Cmd | allowedImpl[t] }
noJunk"""
scope = "3 but 2 Mod, 3 Src, 1 Key, 1 Entry"
expect = "instance"

[[model]]
name = "DependencyClosure"
tool = "alloy"
file = "formal/alloy/DependencyClosure.als"
scope = "5"  # default for every command below
calibration = """2026-09-24: the golden replays (25765 exhaustive instances) and the rapid tidy \
test detect all four seeded code defects: diagnostics without per-key dedup, \
declared roots reported as missing, tidy stopping after one round, and the \
vendored check reading only the first requirement."""

[model.golden]
command = "golden"
output = "pkg/invowkmod/testdata/formal/dependency_closure_golden.json.gz"

[[model.command]]
name = "syncAcceptsOnlyClosedSets"
body = "closedIffNoDiag[diagKeys]"
expect = "pass"
property = "closedIffNoDiag"
antecedent = "anteSync"

[[model.command]]
name = "anteSync"
body = "some Root.roots and some diagKeys"
expect = "instance"

[[model.command]]
name = "diagnosticsWithinClosure"
body = "diagWithinClosure[diagKeys]"
expect = "pass"
property = "diagWithinClosure"
antecedent = "anteDiag"

[[model.command]]
name = "anteDiag"
body = "some diagKeys"
expect = "instance"

[[model.command]]
name = "tidyAddsNoDeclaredKey"
body = "tidyMinimal[tidyResult]"
expect = "pass"
property = "tidyMinimal"
antecedent = "anteTidy"

[[model.command]]
name = "anteTidy"
body = "some tidyResult"
expect = "instance"

# Rejecting mutants.
[[model.command]]
name = "mutantAllModules"
body = "closedIffNoDiag[diagKeysAllModules]"
expect = "counterexample"
property = "closedIffNoDiag"
mutant_of = "syncAcceptsOnlyClosedSets"

[[model.command]]
name = "mutantDiagIncludesRoots"
body = "diagWithinClosure[resolved.requires]"
expect = "counterexample"
property = "diagWithinClosure"
mutant_of = "diagnosticsWithinClosure"

[[model.command]]
name = "mutantTidyIncludesRoots"
body = "tidyMinimal[Root.roots.*step]"
expect = "counterexample"
property = "tidyMinimal"
mutant_of = "tidyAddsNoDeclaredKey"

# Witnesses.
[[model.command]]
name = "witnessDeepChain"
body = "some disj a, b, c: Key | a in Root.roots and b in a.step and c in b.step and c not in Root.roots + a.step"
expect = "instance"
witness = true

[[model.command]]
name = "witnessCycle"
body = "some k: Key | k in k.^step and some Root.roots"
expect = "instance"
witness = true

[[model.command]]
name = "witnessDiamond"
body = "some disj a, b, c: Key | (a + b) in Root.roots and c in a.step and c in b.step and c not in Root.roots"
expect = "instance"
witness = true

# Golden vectors: one-step diagnostics and tidy result for every small graph.
[[model.command]]
name = "golden"
body = """
Root.diagSet = diagKeys
Root.tidySet = tidyResult"""
scope = "3"
expect = "instance"

[[model]]
name = "LockIdentity"
tool = "alloy"
file = "formal/alloy/LockIdentity.als"
scope = "4"  # default for every command below
calibration = """2026-09-24: the golden replay (28858 exhaustive instances) detects all four \
seeded code defects: identity without the namespace fallback, namespace preferred \
over module_id, and an off-by-one ambiguity threshold in each of \
FindAmbiguousLockedModuleEntries and EvaluateVendoredModuleHash."""

[model.golden]
command = "golden"
output = "pkg/invowkmod/testdata/formal/lock_identity_golden.json.gz"

[[model.command]]
name = "v2NeverUnhashed"
body = "v2Parse implies noUnhashedIdentity[V2]"
expect = "pass"
property = "noUnhashedIdentity"
antecedent = "anteV2"

[[model.command]]
name = "anteV2"
body = "v2Parse and Lock.version = V2 and some Entry"
expect = "instance"

# Rejecting mutant: without the parser fact, a v2 lock could skip verification.
[[model.command]]
name = "mutantV2WithoutParseFact"
body = "noUnhashedIdentity[V2]"
expect = "counterexample"
property = "noUnhashedIdentity"
mutant_of = "v2NeverUnhashed"

# Witnesses.
[[model.command]]
name = "witnessV1Unhashed"
body = "v2Parse and Lock.version = V1 and some m: Id | evalUnhashed[m]"
expect = "instance"
witness = true

[[model.command]]
name = "witnessFallbackCollision"
body = """
v2Parse and Lock.version = V1
some disj a, b: Entry | no a.mid and some b.mid and a.nsId = b.mid"""
expect = "instance"
witness = true

[[model.command]]
name = "witnessEmptyIdentity"
body = "v2Parse and some e: Entry | no identity[e]"
expect = "instance"
witness = true

# Golden vectors: the implementation's decisions for every small lock.
[[model.command]]
name = "golden"
body = """
v2Parse
noJunk
Lock.ambiguous = ambiguousIds
Lock.missing = { m: Id | evalMissing[m] }
Lock.unhashed = { m: Id | evalUnhashed[m] }
Lock.compared = { m: Id | evalCompared[m] }"""
scope = "3 but 2 Id, 2 Hash"
expect = "instance"

[[model]]
name = "Serverbase"
tool = "tla"
file = "formal/tla/Serverbase.tla"
calibration = """2026-09-25: findings F1 and F2 are fixed; the base configuration now mirrors \\
the fixed code, and the pre-fix code is kept as two regression mutants. \\
2026-09-24: TLC reproduced findings F1 and F2 with exactly the interleavings \\
predicted by reading internal/core/serverbase/base.go (F1: Start CAS, Stop CAS, \\
Stop reads nil cancel, Start stores ctx; F2: Fail reads Created under the lock, \\
Stop CASes Created->Stopped lock-free, Fail stores Failed), and both fixed \\
configurations pass. The sequential rapid binding detects three seeded defects \\
(Created stop reporting a win, Running without closing the started channel, \\
Stopped leaving the error channel open)."""

[model.constants]
Procs = "{p1, p2}"
Mutant = "\"none\""
FixStartOrdering = "TRUE"
FixTerminalCAS = "TRUE"

[[model.command]]
name = "errClosedOnce"
expect = "pass"
property = "ErrClosedAtMostOnce"
dead_actions = ["RunCloseLoser", "StartStore"]

[[model.command]]
name = "mutantCloseTwice"
constants = { Mutant = "\"close_twice\"" }
expect = "counterexample"
property = "ErrClosedAtMostOnce"
mutant_of = "errClosedOnce"

[[model.command]]
name = "noSendAfterClose"
expect = "pass"
property = "NoSendAfterClose"
dead_actions = ["RunCloseLoser", "StartStore"]

[[model.command]]
name = "mutantSendWithoutCheck"
constants = { Mutant = "\"send_without_check\"" }
expect = "counterexample"
property = "NoSendAfterClose"
mutant_of = "noSendAfterClose"

[[model.command]]
name = "startedByWinner"
expect = "pass"
property = "StartedClosedByWinner"
dead_actions = ["RunCloseLoser", "StartStore"]

[[model.command]]
name = "mutantCloseStartedUnconditionally"
constants = { Mutant = "\"close_started_unconditionally\"" }
expect = "counterexample"
property = "StartedClosedByWinner"
mutant_of = "startedByWinner"

# F2 (fixed): the pre-fix blind Store violates TerminalAbsorbing.
[[model.command]]
name = "terminalAbsorbingFixed"
constants = { FixTerminalCAS = "TRUE" }
expect = "pass"
property = "TerminalAbsorbing"
dead_actions = ["RunCloseLoser", "StartStore"]

[[model.command]]
name = "mutantPreFixF2BlindStore"
constants = { FixTerminalCAS = "FALSE" }
expect = "counterexample"
property = "TerminalAbsorbing"
mutant_of = "terminalAbsorbingFixed"

# F1 (fixed): the pre-fix unlocked start violates StopCancelsContext.

[[model.command]]
name = "mutantNoTerminalCheck"
constants = { FixTerminalCAS = "TRUE", Mutant = "\"no_terminal_check\"" }
expect = "counterexample"
property = "TerminalAbsorbing"
mutant_of = "terminalAbsorbingFixed"

[[model.command]]
name = "stopCancelsContextFixed"
constants = { FixStartOrdering = "TRUE" }
expect = "pass"
property = "StopCancelsContext"
dead_actions = ["RunCloseLoser", "StartStore"]

[[model.command]]
name = "mutantPreFixF1UnlockedStart"
constants = { FixStartOrdering = "FALSE" }
expect = "counterexample"
property = "StopCancelsContext"
mutant_of = "stopCancelsContextFixed"


[[model.command]]
name = "mutantStopSkipsCancel"
constants = { FixStartOrdering = "TRUE", Mutant = "\"stop_skips_cancel\"" }
expect = "counterexample"
property = "StopCancelsContext"
mutant_of = "stopCancelsContextFixed"

[[model.command]]
name = "witnessConcurrentStop"
expect = "counterexample"
property = "WitnessNoConcurrentStop"
witness = true

[[model.command]]
name = "witnessRunning"
expect = "counterexample"
property = "WitnessNeverRunning"
witness = true

[[model.command]]
name = "witnessStartedClosed"
expect = "counterexample"
property = "WitnessNeverStartedClosed"
witness = true

[[model]]
name = "LockIntegrity"
tool = "tla"
file = "formal/tla/LockIntegrity.tla"
calibration = """2026-09-25: findings F4 and F6 are fixed (hashless entries are rejected for \\
vendored content and never vouch for a cached copy; admission compares the \\
caller's locked hash with the discovered copy); the pre-fix behaviours are \\
regression mutants. 2026-09-24: TLC reproduced finding F5 (tag moved, cache empty, sync rewrites the \\
lock hash to the attacker's content and so also launders a tampered vendored \\
copy), and the fix shipped in verify-locked-module-integrity (#142) passes. \\
F4 and F6 reproduce as counterexamples with passing fix configurations, and \\
Go replay tests confirm both behaviours in the real code."""

[model.constants]
FixedSync = "TRUE"
RejectUnhashed = "TRUE"
CheckCallerHash = "TRUE"
LegacyLock = "FALSE"
Mutant = "\"none\""

[[model.command]]
name = "f5FixedSync"
expect = "pass"
property = "OwnLoadTrusted"

[[model.command]]
name = "findingF5FreshCacheSync"
finding = "F5"
constants = { FixedSync = "FALSE" }
expect = "counterexample"
property = "OwnLoadTrusted"
mutant_of = "f5FixedSync"


[[model.command]]
name = "mutantTrustCache"
constants = { FixedSync = "TRUE", Mutant = "\"trust_cache\"" }
expect = "counterexample"
property = "OwnLoadTrusted"
mutant_of = "f5FixedSync"

[[model.command]]
name = "f4RejectUnhashed"
constants = { RejectUnhashed = "TRUE", LegacyLock = "TRUE" }
expect = "pass"
property = "OwnLoadTrusted"

[[model.command]]
name = "mutantPreFixF4TrustHashless"
constants = { LegacyLock = "TRUE", RejectUnhashed = "FALSE" }
expect = "counterexample"
property = "OwnLoadTrusted"
mutant_of = "f4RejectUnhashed"


[[model.command]]
name = "mutantDiscoverAcceptsUnhashed"
constants = { FixedSync = "TRUE", RejectUnhashed = "TRUE", LegacyLock = "TRUE", Mutant = "\"discover_accepts_unhashed\"" }
expect = "counterexample"
property = "OwnLoadTrusted"
mutant_of = "f4RejectUnhashed"

[[model.command]]
name = "f6CheckCallerHash"
expect = "pass"
property = "SiblingCallTrusted"

[[model.command]]
name = "mutantPreFixF6AdmitByIdentity"
constants = { CheckCallerHash = "FALSE" }
expect = "counterexample"
property = "SiblingCallTrusted"
mutant_of = "f6CheckCallerHash"


[[model.command]]
name = "mutantCompareWithSiblingLock"
constants = { FixedSync = "TRUE", Mutant = "\"compare_with_sibling_lock\"" }
expect = "counterexample"
property = "SiblingCallTrusted"
mutant_of = "f6CheckCallerHash"

[[model.command]]
name = "witnessMovedTag"
constants = { FixedSync = "FALSE", CheckCallerHash = "FALSE" }
expect = "counterexample"
property = "WitnessNoMovedTag"
witness = true

[[model.command]]
name = "witnessLoadedGood"
expect = "counterexample"
property = "WitnessNeverLoadedGood"
witness = true

[[model.command]]
name = "witnessCalledGood"
expect = "counterexample"
property = "WitnessNeverCalledGood"
witness = true

[[model]]
name = "AtomicWrite"
tool = "tla"
file = "formal/tla/AtomicWrite.tla"
calibration = """2026-09-25: finding F3 is fixed; the base configuration makes both fsyncs and \\
the pre-fix configurations are regression mutants. 2026-09-24: under the named POSIX axioms TLC showed finding F3 (no fsync: power \\
loss can leave an empty lock file even though readers never see partial \\
content), that fsync(file) alone restores D-Atomic, and that fsync(file) plus \\
fsync(dir) are needed for D-Commit. The real-filesystem binding detects two \\
seeded defects (no temp cleanup, rename before write)."""

[model.constants]
SyncFile = "TRUE"
SyncDir = "TRUE"
Mutant = "\"none\""

[[model.command]]
name = "readersNeverSeePartial"
expect = "pass"
property = "ReadersNeverSeePartial"

[[model.command]]
name = "mutantWriteInPlace"
constants = { Mutant = "\"in_place\"" }
expect = "counterexample"
property = "ReadersNeverSeePartial"
mutant_of = "readersNeverSeePartial"

[[model.command]]
name = "tempRemovedOnError"
expect = "pass"
property = "TempRemovedOnError"

[[model.command]]
name = "mutantSkipCleanup"
constants = { Mutant = "\"skip_cleanup\"" }
expect = "counterexample"
property = "TempRemovedOnError"
mutant_of = "tempRemovedOnError"

# F3 (fixed): D-Atomic needs fsync(file); D-Commit needs fsync(file) and fsync(dir).
# The code makes both; the configurations without them are regression mutants.
[[model.command]]
name = "durableAtomicFileSyncOnly"
constants = { SyncFile = "TRUE", SyncDir = "FALSE" }
expect = "pass"
property = "DurableAtomic"
dead_actions = ["FailDir"]

[[model.command]]
name = "mutantPreFixNoSyncAtomic"
constants = { SyncFile = "FALSE", SyncDir = "FALSE" }
expect = "counterexample"
property = "DurableAtomic"
mutant_of = "durableAtomicFileSyncOnly"

[[model.command]]
name = "durableAtomic"
expect = "pass"
property = "DurableAtomic"

[[model.command]]
name = "durableAtomicDirSyncOnly"
constants = { SyncFile = "FALSE", SyncDir = "TRUE" }
expect = "counterexample"
property = "DurableAtomic"
mutant_of = "durableAtomic"

[[model.command]]
name = "durableCommit"
expect = "pass"
property = "DurableCommit"

[[model.command]]
name = "mutantPreFixNoSyncCommit"
constants = { SyncFile = "FALSE", SyncDir = "FALSE" }
expect = "counterexample"
property = "DurableCommit"
mutant_of = "durableCommit"

[[model.command]]
name = "durableCommitFileSyncOnly"
constants = { SyncFile = "TRUE", SyncDir = "FALSE" }
expect = "counterexample"
property = "DurableCommit"
mutant_of = "durableCommit"

[[model.command]]
name = "witnessCrashAfterReturn"
expect = "counterexample"
property = "WitnessNoCrashAfterReturn"
witness = true

[[model.command]]
name = "witnessFailure"
expect = "counterexample"
property = "WitnessNoFailure"
witness = true

[[model]]
name = "HostCallbackToken"
tool = "tla"
file = "formal/tla/HostCallbackToken.tla"
calibration = """2026-09-25: finding F7 is fixed (revocation closes the connections the token \\
authenticated); the base configuration now mirrors the code, the pre-fix behaviour \\
is a regression mutant, and the rapid binding covers sessions (it detects \\
revocation leaving connections open and expiry closing them). \\
2026-09-24: TLC shows that no login succeeds after its execution ends, because \\
every end path revokes the token, and that an open session outlives the \\
execution that opened it (finding F7) unless revocation closes sessions. The \\
rapid token binding detects two seeded defects (revoke as a no-op, expiry \\
ignored)."""

[model.constants]
Execs = "{e1, e2}"
Mutant = "\"none\""
RevokeClosesSessions = "TRUE"

[[model.command]]
name = "noAuthAfterExecution"
expect = "pass"
property = "NoAuthAfterExecution"

[[model.command]]
name = "mutantNoRevokeOnSuccess"
constants = { Mutant = "\"no_revoke_on_success\"" }
expect = "counterexample"
property = "NoAuthAfterExecution"
mutant_of = "noAuthAfterExecution"

[[model.command]]
name = "noSessionAfterStop"
expect = "pass"
property = "NoSessionAfterStop"

[[model.command]]
name = "mutantListenerLeftOpen"
constants = { Mutant = "\"listener_left_open\"" }
expect = "counterexample"
property = "NoSessionAfterStop"
mutant_of = "noSessionAfterStop"

# Fixed finding F7: revocation closes the token's sessions.
[[model.command]]
name = "sessionLifetimeWithRevokeClosing"
expect = "pass"
property = "NoSessionAfterExecution"

[[model.command]]
name = "mutantPreFixF7RevokeKeepsSessions"
constants = { RevokeClosesSessions = "FALSE" }
expect = "counterexample"
property = "NoSessionAfterExecution"
mutant_of = "sessionLifetimeWithRevokeClosing"


[[model.command]]
name = "mutantKeepSessionsOnError"
constants = { Mutant = "\"keep_sessions_on_error\"" }
expect = "counterexample"
property = "NoSessionAfterExecution"
mutant_of = "sessionLifetimeWithRevokeClosing"

[[model.command]]
name = "witnessAuth"
expect = "counterexample"
property = "WitnessNoAuth"
witness = true

[[model.command]]
name = "witnessOverlap"
expect = "counterexample"
property = "WitnessNoOverlap"
witness = true

[[model]]
name = "Watch"
tool = "tla"
file = "formal/tla/Watch.tla"
calibration = """2026-09-24: TLC shows no lost burst under fairness of system actions only (and \\
a counterexample without fairness), no overlapping callbacks, balanced \\
WaitGroup accounting, and no work after Run returns; each safety property is \\
guarded by a named-violation mutant. The binding uses a fake timer checked \\
against time.AfterFunc's Reset/Stop contract, because the existing manual \\
timer always returned false. It detects two seeded defects (busy fire dropping \\
the burst, missing wg.Add when Reset returns false)."""

[model.constants]
Events = "{\"ev1\", \"ev2\"}"
Goroutines = "{g1, g2}"
Mutant = "\"none\""

[[model.command]]
name = "noOverlappingCallbacks"
expect = "pass"
property = "NoOverlappingCallbacks"

[[model.command]]
name = "mutantNoBusyGuard"
constants = { Mutant = "\"no_busy_guard\"" }
expect = "counterexample"
property = "NoOverlappingCallbacks"
mutant_of = "noOverlappingCallbacks"

[[model.command]]
name = "waitGroupBalanced"
expect = "pass"
property = "WaitGroupBalanced"

[[model.command]]
name = "mutantResetSkipsAdd"
constants = { Mutant = "\"reset_skips_add\"" }
expect = "counterexample"
property = "WaitGroupBalanced"
mutant_of = "waitGroupBalanced"

[[model.command]]
name = "nothingAfterReturn"
expect = "pass"
property = "NothingAfterReturn"

[[model.command]]
name = "mutantNoWait"
constants = { Mutant = "\"no_wait\"" }
expect = "counterexample"
property = "NothingAfterReturn"
mutant_of = "nothingAfterReturn"

[[model.command]]
name = "noLostBurst"
temporal = true
expect = "pass"
property = "NoLostBurst"

[[model.command]]
name = "noLostBurstWithoutFairness"
spec = "UnfairSpec"
temporal = true
expect = "counterexample"
property = "NoLostBurst"
mutant_of = "noLostBurst"
fairness_twin_of = "noLostBurst"

[[model.command]]
name = "witnessBusySkip"
expect = "counterexample"
property = "WitnessNoBusySkip"
witness = true

[[model.command]]
name = "witnessDelivery"
expect = "counterexample"
property = "WitnessNoDelivery"
witness = true

# Trace validation: Go harnesses record traces from the real code; the trace
# spec must accept every recorded trace and reject every targeted mutation.
[[trace]]
name = "Serverbase"
package = "./internal/core/serverbase/"

[[trace]]
name = "AtomicWrite"
package = "./pkg/fspath/"

[[trace]]
name = "Watch"
package = "./internal/watch/"
